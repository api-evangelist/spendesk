specificationVersion: '0.23'

description: 'Spendesk is an AI-powered spend management and procurement platform serving over 200,000 users across Europe. Its public REST API
  enables partners and customers to integrate programmatic card issuance, transaction retrieval, expense claims processing, vendor and invoice
  management, and accounting exports into their own tools and workflows. Authentication is supported via API keys (for customers) and OAuth2 (for
  partners building native integrations). API access requires a Premium or Enterprise subscription plan, and the developer portal at developer.spendesk.com
  provides reference documentation, changelogs, a Postman collection, and webhook administration.

  '

