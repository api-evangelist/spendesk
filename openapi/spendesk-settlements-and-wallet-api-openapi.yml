            - $ref: '#/components/schemas/updateSettlementStateFailure'
      required:
      - updatedSettlements
      title: bulkUpdateSettlementsStatePartialSuccess
    unsupportedMediaType:
      type: object
      description: Unsupported Media Type
      additionalProperties: false
