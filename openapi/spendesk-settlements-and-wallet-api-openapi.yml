    payable:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The ID of the Payable
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          example: bc9cef35-401d-4ea4-b384-ed725e6685cf
        type:
          type: string
          enum:
          - expenseClaim
          - invoicePurchase
          - creditNote
          - singlePurchaseCard
          - multiUseCard
          - subscriptionCard
          - physicalCard
          - mileageAllowance
          - perDiemAllowance
          - reverseBill
          description: "Indicates the type of the payable. \n\nType | Description |\n---------|----------|\n `expenseClaim` | An expense claim submitted and approved | \n `invoicePurchase` | An invoice to pay submitted and approved | \n `creditNote` | A credit note submitted and approved |\n  `singlePurchaseCard` | A purchase made with a single-use virtual card |\n  `multiUseCard` | A purchase made with a multi-use virtual card | \n  `subscriptionCard` | A purchase made with a subscription virtual card |\n  `physicalCard` | A purchase made with a physical card |\n  `mileageAllowance` | A mileage expense submitted and approved |\n  `perDiemAllowance` | A per diem expense submitted and approved |\n  `reverseBill` | A refund or a late return (aka cash return) |\""
        version:
          type: number
          description: The current version of this payable. This is incremented every time the payable is modified.
        userId:
          type: string
          description: The ID of the Spendesk user who created this payable.
        bookkeepingStatus:
          $ref: '#/components/schemas/bookkeepingStatus'
        companyId:
          type: string
          description: The ID of the company (this could be a wallet or an entity).
        appUrl:
          type: string
          description: Link to this payable in the Spendesk web app.
          example: https://app.spendesk.com/app/RRbRgeIB7X/payables/bc9cef35-401d-4ea4-b384-ed725e6685cf
        costCenterId:
          type: string
          nullable: true
          description: The ID of the cost center, if available.
        costCenterName:
          type: string
          nullable: true
          description: The name of the cost center, if available.
        teamId:
          type: string
          nullable: true
          description: The ID of the team.
        teamName:
          type: string
          nullable: true
          description: The name of the team.
        analyticalProperties:
          type: array
          items:
            $ref: '#/components/schemas/analyticalProperties'
        payableDate:
          type: string
          format: date
          description: 'For expenses - this is the date of the expense.

            For reversals - this is the date of the reversal.

            In the `YYYY-MM-DD` format.'
        accountingDate:
          type: string
          nullable: true
          format: date
          description: 'This feature is not activated by default.

            If activated, `accounting date` field allows accountants to override the original expense date.

            In the `YYYY-MM-DD` format.'
        invoiceDueDate:
          type: string
          nullable: true
          format: date
          description: The date the invoice is due. In the `YYYY-MM-DD` format.
        amount:
          $ref: '#/components/schemas/priceAmount'
        currency:
          $ref: '#/components/schemas/currency'
        functionalAmount:
          $ref: '#/components/schemas/priceAmount'
        functionalCurrency:
          $ref: '#/components/schemas/currency'
        functionalExchangeRate:
          type: number
          description: If the payment was made in a foreign currency, this will be the exchange rate that was applied when the payment was made.
        outstandingAmount:
          allOf:
          - $ref: '#/components/schemas/priceAmount'
          description: Portion of the payable amount not yet covered by allocations, in the payable currency minor units (e.g. cents for EUR and USD, but yen for JPY). Zero means fully allocated. Absent if allocation tracking is unavailable for this payable.
        outstandingFunctionalAmount:
          allOf:
          - $ref: '#/components/schemas/priceAmount'
          description: Same as `outstandingAmount` but expressed in the company's functional currency minor units.
        invoiceNumber:
          type: string
          nullable: true
          description: Invoice number, if available.
        purchaseOrderNumber:
          type: string
          nullable: true
          description: Purchase order number linked to this invoice payable, if available.
        creditNoteNumber:
          type: string
          nullable: true
          description: Credit Note number, if available.
        referenceInvoiceNumber:
          type: string
          nullable: true
          description: Invoice number of an invoice that resulted in a credit note, if available.
        description:
          type: string
          nullable: true
          description: Description of the payable.
        exportedAt:
          type: string
          nullable: true
          format: date-time
          description: The date this payable was first exported via an accounting export. In the [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date format.
        createdAt:
          type: string
          format: date-time
          description: The timestamp of the creation of this payable. String containing a UTC datetime expressed in ISO 8601 format like `2023-05-12T14:06:40Z` (source `https://en.wikipedia.org/wiki/ISO_8601`).
        commitmentCounterparty:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            type:
              type: string
              enum:
              - supplier
              - employee
            name:
              type: string
          required:
          - type
          - name
          description: The counterparty associated with the spending commitment, or null when unavailable. For expense claims, use its name as the merchant name only when type is supplier. counterparty is the employee being reimbursed; their accountPayable must not be used as a merchant creditor account.
        counterparty:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
              description: The ID of this counterparty.
            type:
              type: string
              enum:
              - supplier
              - employee
              description: The type of this counterparty.
            name:
              type: string
              nullable: true
              description: The name of this counterparty.
            accountPayable:
              type: object
              nullable: true
              additionalProperties: false
              properties:
                id:
                  type: string
                  description: Internal Spendesk ID of the account payable.
                generalAccountCode:
                  type: string
                  description: Accounting code of the account payable.
                auxiliaryAccountCode:
                  type: string
                  nullable: true
                  description: Auxiliary code of the account payable, if available.
              required:
              - id
              - generalAccountCode
              - auxiliaryAccountCode
          required:
          - id
          - type
          - name
          - accountPayable
          description: A payable is due to either a supplier or an employee.
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/payableLineItem'
          description: Line items of the payable.
        allocations:
          type: array
          items:
            oneOf:
            - type: object
              additionalProperties: false
              properties:
                type:
                  enum:
                  - settlement
                allocatedAmount:
                  allOf:
                  - $ref: '#/components/schemas/priceAmount'
                  description: Payable amount allocated to this settlement. Expressed in smallest units of the currency (e.g. cents for EUR and USD, but yen for JPY).
                settlementId:
                  type: string
                  description: The ID of the allocated settlement.
              required:
              - type
              - allocatedAmount
              - settlementId
            - type: object
              additionalProperties: false
              properties:
                type:
                  enum:
                  - expense
                allocatedAmount:
                  allOf:
                  - $ref: '#/components/schemas/priceAmount'
                  description: Payable amount allocated to expenses. Expressed in smallest units of the currency (e.g. cents for EUR and USD, but yen for JPY).
                payableId:
                  type: string
                  format: uuid
                  description: The ID of the Payable
                  examples:
                  - bc9cef35-401d-4ea4-b384-ed725e6685cf
                  pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
              required:
              - type
              - allocatedAmount
              - payableId
            - type: object
              additionalProperties: false
              properties:
                type:
                  enum:
                  - reversal
                allocatedAmount:
                  allOf:
                  - $ref: '#/components/schemas/priceAmount'
                  description: Payable amount allocated to reversals. Expressed in smallest units of the currency (e.g. cents for EUR and USD, but yen for JPY).
                payableId:
                  type: string
                  format: uuid
                  description: The ID of the Payable
                  examples:
                  - bc9cef35-401d-4ea4-b384-ed725e6685cf
                  pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
              required:
              - type
              - allocatedAmount
              - payableId
          description: An array of allocations for the payable. An expense payable can have a settlement or a reversal payable allocated to it. A reversal payable can have a settlement or an expense payable allocated to it.
        amortisation:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            date:
              type: object
              additionalProperties: false
              properties:
                from:
                  type: string
                  format: date-time
                  description: Start date of the amortisation period. In the ISO 8601 date-time format.
                to:
                  type: string
                  format: date-time
                  description: End date of the amortisation period. In the ISO 8601 date-time format.
              required:
              - from
              - to
          required:
          - date
          description: Amortisation details for the payable, if applicable.
      required:
      - id
      - version
      - type
      - userId
      - bookkeepingStatus
      - companyId
      - teamId
      - teamName
      - payableDate
      - accountingDate
      - invoiceDueDate
      - amount
      - currency
      - functionalAmount
      - functionalCurrency
      - functionalExchangeRate
      - invoiceNumber
      - purchaseOrderNumber
      - creditNoteNumber
      - referenceInvoiceNumber
      - description
      - exportedAt
      - createdAt
      - counterparty
      - lineItems
      - analyticalProperties
      - allocations
      description: A payable is a short-term liability owed by a company to its creditors (suppliers or employees). Several types of payables are supported by Spendesk, e.g. Invoices, Credit Notes, Expense Claims, Physical card purchases, Single Use card purchases, Subscription card purchases, etc.
      title: payable
    walletSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: The wallet ID.
        name:
          type: string
          description: The wallet name.
        status:
          type: string
          enum:
          - active
          description: The status of the wallet.
        currency:
          $ref: '#/components/schemas/currency'
        totalAmount:
          allOf:
          - $ref: '#/components/schemas/priceAmount'
          description: The total amount currently loaded on the wallet. Card settlements can be delayed in which case totalAmount may differ from (wallet loads - sum of settlements). Expressed in smallest units of the currency (e.g. cents for EUR and USD, but yen for JPY).
        totalAvailableAmount:
          allOf:
          - $ref: '#/components/schemas/priceAmount'
          description: The total amount currently available for spend. Expressed in smallest units of the currency (e.g. cents for EUR and USD, but yen for JPY).
        totalAllocatedAmount:
          allOf:
          - $ref: '#/components/schemas/priceAmount'
          description: The total amount allocated on cards & scheduled transfers. Expressed in smallest units of the currency (e.g. cents for EUR and USD, but yen for JPY).
        allocatedOnCards:
          type: object
          additionalProperties: false
          properties:
            subscriptionAmount:
              allOf:
              - $ref: '#/components/schemas/priceAmount'
              description: Amount allocated on card to subscription. Expressed in smallest units of the currency (e.g. cents for EUR and USD, but yen for JPY).
            physicalAmount:
              allOf:
              - $ref: '#/components/schemas/priceAmount'
              description: Amount allocated on card to physical. Expressed in smallest units of the currency (e.g. cents for EUR and USD, but yen for JPY).
            singlePurchaseAmount:
              allOf:
              - $ref: '#/components/schemas/priceAmount'
              description: Amount allocated on card to single purchase. Expressed in smallest units of the currency (e.g. cents for EUR and USD, but yen for JPY).
            totalAllocatedAmount:
              allOf:
              - $ref: '#/components/schemas/priceAmount'
              description: Total amount allocated on card. Expressed in smallest units of the currency (e.g. cents for EUR and USD, but yen for JPY).
          required:
          - subscriptionAmount
          - physicalAmount
          - singlePurchaseAmount
          - totalAllocatedAmount
        scheduledTransfersAmount:
          type: object
          additionalProperties: false
          properties:
            scheduledExpenseClaimsAmount:
              allOf:
              - $ref: '#/components/schemas/priceAmount'
              description: Amount allocated to scheduled transfers. Expressed in smallest units of the currency (e.g. cents for EUR and USD, but yen for JPY).
            scheduledInvoicesAmount:
              allOf:
              - $ref: '#/components/schemas/priceAmount'
              description: Amount allocated to scheduled transfers. Expressed in smallest units of the currency (e.g. cents for EUR and USD, but yen for JPY).
            totalScheduledTransferAmount:
              allOf:
              - $ref: '#/components/schemas/priceAmount'
              description: Amount allocated to scheduled transfers. Expressed in smallest units of the currency (e.g. cents for EUR and USD, but yen for JPY).
          required:
          - scheduledExpenseClaimsAmount
          - scheduledInvoicesAmount
          - totalScheduledTransferAmount
      required:
      - id
      - name
      - status
      - currency
      - totalAmount
      - totalAvailableAmount
      - totalAllocatedAmount
      - allocatedOnCards
      - scheduledTransfersAmount
      title: walletSummary
    tooLarge:
