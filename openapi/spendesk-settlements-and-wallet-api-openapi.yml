      required:
      - updatedSettlements
      title: bulkUpdateSettlementsStateFullSuccess
    date:
      type: string
      format: date
      description: String containing a date expressed in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format like `2023-05-12`.
      title: date
    badRequest:
      type: object
      description: Bad request
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            additionalProperties: false
            type: object
            properties:
              code:
                type: string
                enum:
                - BAD_REQUEST_INCORRECT_OR_MISSING_FIELD
                - RESPONSE_TOO_LARGE
              detail:
                type: string
              source:
                type: string
            required:
            - code
            - detail
            - source
      required:
      - errors
      title: badRequest
    walletLoad:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: Wallet load ID
        amount:
          allOf:
          - $ref: '#/components/schemas/priceAmount'
          description: Amount of the wallet load. Always in wallet currency. Expressed in smallest units of the currency (e.g. cents for EUR and USD, but yen for JPY).
        currency:
          $ref: '#/components/schemas/currency'
        createdAt:
          allOf:
          - $ref: '#/components/schemas/dateTime'
          description: The date the banking provider booked the wallet load (accounting date on SFS EEA accounts, value date on SFS GBP accounts, entry date on legacy accounts), not a record-creation timestamp.
        type:
          type: string
          enum:
          - card
          - wireTransfer
          description: The type of wallet load.
        bankName:
          type: string
          enum:
          - sfs
          - adyen
          - other
          description: The name of the payment institution holding the account.
      required:
      - id
      - amount
      - currency
      - createdAt
      - type
      title: walletLoad
    bankFee:
      additionalProperties: false
      type: object
      properties:
        id:
          type: string
          description: ID of this bank fee entry. One bank fee can have several entries; group them with bankFeeId.
        bankFeeId:
          type: string
          description: ID of the bank fee this entry belongs to.
        kind:
          type: string
          enum:
          - fxFee
          - atmFee
          - otherFee
          description: '`fxFee` refers to fees incurred by a payment in a foreign currency, and `atmFee` refers to fees incurred at an atm, e.g. to withdraw cash.'
        settlementId:
          type: string
          description: The ID of the Settlement related to this bank fee.
        amount:
          allOf:
          - $ref: '#/components/schemas/priceAmount'
          description: Amount of the fee, always in wallet currency. Expressed in smallest units of the currency (e.g. cents for EUR and USD, but yen for JPY).
        currency:
          $ref: '#/components/schemas/currency'
        chargedAt:
          allOf:
          - $ref: '#/components/schemas/dateTime'
          description: 'Date and time of this entry: when the bank fee was incurred for its first entry, and when it was corrected for a correction entry.'
      required:
      - id
      - bankFeeId
      - kind
      - amount
      - currency
      - chargedAt
      - settlementId
      description: 'When money moves via a card being charged or with a wire-transfer, a Settlement is be created. If there were any fees for this transaction, such as FX fees, they will be recorded as a Bank fee. Each item is an append-only entry: a correction adds an entry for the difference, which can be zero or negative, so the amount of a fee is the sum of the amounts of its entries.'
      title: bankFee
    priceAmount:
      type: number
      description: 'If the payment was made in a foreign currency, this amount will be the one in the payment currency.

        Can contain a negative value in case of refunds.

        Expressed in smallest units of the currency (e.g. cents for EUR and USD, but yen for JPY).'
      title: priceAmount
