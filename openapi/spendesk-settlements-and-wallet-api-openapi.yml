openapi: 3.2.0
info:
  title: Spendesk Public Settlements and wallet API
  description: Spendesk Public API
  version: '1.0'
  summary: Spendesk Public API
  contact:
    email: support-public-api@spendesk.com
    url: https://developer.spendesk.com/
    name: Spendesk for Developers
  termsOfService: https://www.spendesk.com/en/legals/terms/api-agreement
servers:
- url: https://public-api.spendesk.com
  description: Production
- url: https://public-api.demo.spendesk.com
  description: Sandbox
tags:
- name: Settlements and wallet
  description: 'Money movements on the Spendesk wallet: settlements (payments) and their export state, bank fees, wallet loads and the wallet summary. Part of: What is Spend Data?, Building an accounting integration.'
paths:
  /v1/bank-fees:
    get:
      operationId: v1-get-bank-fees
      summary: Get Bank Fees
      tags:
      - Settlements and wallet
      description: '**Allowed Scopes**: _`bank-fee:read`_


        Returns bank fees. For more information about bank fees, see this guide. Bank fees data are cached for up to 24 hours. Changes, including those made through the API, can take up to 24 hours to appear.'
      parameters:
      - schema:
          type: integer
          default: 1
          minimum: 1
        in: query
        name: page
        required: false
        description: Page number
      - schema:
          type: integer
          default: 30
          minimum: 1
          maximum: 30
        in: query
        name: pageSize
        required: false
        description: Page size
      - schema:
          allOf:
          - $ref: '#/components/schemas/dateTime'
        in: query
        name: from
        required: false
        description: Start date of the requested period, with timezone offset (`Z` for UTC).
      - schema:
          allOf:
          - $ref: '#/components/schemas/dateTime'
        in: query
        name: to
        required: false
        description: End date of the requested period, with timezone offset (`Z` for UTC).
      - schema:
          type: array
          items:
            type: string
        in: query
        name: settlementIds
        required: false
        description: An array of settlement IDs, exploded `(settlementIds=1&settlementIds=2)`.
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - bank-fee:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  meta:
                    $ref: '#/components/schemas/meta'
                  data:
                    description: The list of bank fees.
                    type: array
                    items:
                      $ref: '#/components/schemas/bankFee'
                required:
                - data
                - meta
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
  /v1/settlements:
    get:
      operationId: v1-get-settlements
      summary: Get Settlements
      tags:
      - Settlements and wallet
      description: '**Allowed Scopes**: _`settlement:read`_


        Returns settlements. For more information about settlements, see this guide. Settlements data are cached for up to 24 hours. A successful `PUT /v1/settlements/state` clears the cached settlement reads, so the next call is fresh; state changes from accounting exports or made in Spendesk can take up to 24 hours to appear.


        This endpoint uses page-based pagination. Use `page` and `pageSize` to retrieve additional results. The maximum `pageSize` is 30. Continue fetching while `page * pageSize < meta.pagination.total`.


        To filter by settlement status, use `state` (for example, `/v1/settlements?page=1&pageSize=30&state=created`).


        Settlements expose allocation links through `allocations[].payableId`. For accounting export use cases that require payable line amounts, retrieve the related payable and read `lineItems[].financial.netAmount`. Amounts are expressed in the smallest unit of the currency.'
      parameters:
      - schema:
          type: integer
          default: 1
          minimum: 1
        in: query
        name: page
        required: false
        description: Page number
      - schema:
          type: integer
          default: 30
          minimum: 1
          maximum: 30
        in: query
        name: pageSize
        required: false
        description: Page size
      - schema:
          allOf:
          - $ref: '#/components/schemas/dateTime'
        in: query
        name: exportedAfter
        required: false
        description: The date and time the settlement first got exported to accounting, with timezone offset (use `Z` for UTC).
      - schema:
          allOf:
          - $ref: '#/components/schemas/dateTime'
        in: query
        name: exportedBefore
        required: false
        description: The date and time before which the settlement was first exported to accounting, with timezone offset (use `Z` for UTC).
      - schema:
          type: array
          items:
            type: string
            enum:
            - externalAccount
            - spendeskAccount
        in: query
        name: paidFrom
        required: false
        description: Payment account used for the settlement. Card settlements are always `spendeskAccount`; `externalAccount` matches only wire transfers emitted from an external bank account.
      - schema:
          type: array
          items:
            $ref: '#/components/schemas/settlement/properties/id'
          minItems: 1
          uniqueItems: true
        in: query
        name: ids
        required: false
        description: An array of settlement IDs, exploded `(ids=1&ids=2)`.
      - schema:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/settlement/properties/state'
            description: Status of settlements to filter by.
        in: query
        name: state
        required: false
      - schema:
          type: array
          items:
            $ref: '#/components/schemas/settlement/properties/type'
        in: query
        name: types
        required: false
        description: Filter settlements by type.
      - schema:
          oneOf:
          - allOf:
            - $ref: '#/components/schemas/date'
            description: Start date of the requested period. String containing a date expressed in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format like `2023-05-12`.
          - allOf:
            - $ref: '#/components/schemas/dateTime'
            description: Start date of the requested period. String containing a UTC datetime expressed in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format like `2023-05-12T14:06:40Z`.
        in: query
        name: clearedFrom
        required: false
      - schema:
          oneOf:
          - allOf:
            - $ref: '#/components/schemas/date'
            description: End date of the requested period. String containing a date expressed in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format like `2023-05-12`.
          - allOf:
            - $ref: '#/components/schemas/dateTime'
            description: End date of the requested period. String containing a UTC datetime expressed in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format like `2023-05-12T14:06:40Z`.
        in: query
        name: clearedTo
        required: false
      - schema:
          type: string
        in: query
        name: supplierId
        required: false
        description: The ID of the supplier to filter settlements by.
      - schema:
          type: string
        in: query
        name: transactionDescription
        required: false
        description: Filter settlements by transaction description.
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - settlement:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  meta:
                    $ref: '#/components/schemas/meta'
                  data:
                    description: Settlements list
                    type: array
                    items:
                      $ref: '#/components/schemas/settlement'
                required:
                - data
                - meta
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
  /v1/settlements/state:
    put:
      operationId: v1-put-settlements-state
      summary: Update settlements state
      tags:
      - Settlements and wallet
      description: '**Allowed Scopes**: _`experimental:accounting:update`_


        Mark multiple settlements as manually exported after their accounting entries were created outside Spendesk.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                settlements:
                  description: Settlements to update
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        minLength: 1
                        description: The ID of the settlement to update
                        example: bc9cef35-401d-4ea4-b384-ed725e6685cf
                      version:
                        type: number
                        description: The current version of the settlement
                        example: 1
                      state:
                        type: string
                        description: The new state to set for the settlement
                        enum:
                        - exported
                        example: exported
                    required:
                    - id
                    - version
                    - state
                  minItems: 1
                  maxItems: 50
                  example:
                    settlements:
                    - id: d7b2b353-abcd-4199-ace4-708f28e13ab3
                      version: 1
                      state: exported
              required:
              - settlements
      parameters:
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:accounting:update
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bulkUpdateSettlementsStateFullSuccess'
        '207':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bulkUpdateSettlementsStatePartialSuccess'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooLarge'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unsupportedMediaType'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
  /v1/wallet-loads:
    get:
      operationId: v1-get-wallet-loads
      summary: Get Wallet Loads
      tags:
      - Settlements and wallet
      description: '**Allowed Scopes**: _`wallet-load:read`_


        Returns wallet loads of the Spendesk entity (company), either via wiretransfers to Spendesk or via card payments. On GBP wallets `page` is ignored: while `meta.pagination.hasNextPage` is true, follow `meta.pagination.nextUrl` (or send `meta.pagination.nextCursor` as `cursor` with the same `from` and `to`) to get the next page. There, `meta.pagination.total` counts only the rows on the current page, so stop on `hasNextPage`, not on `total`. Wallet loads data are cached for up to 24 hours. Changes, including those made through the API, can take up to 24 hours to appear.'
      parameters:
      - schema:
          type: integer
          default: 1
          minimum: 1
        in: query
        name: page
        required: false
        description: Page number
      - schema:
          type: integer
          default: 30
          minimum: 1
          maximum: 30
        in: query
        name: pageSize
        required: false
        description: Page size
      - schema:
          allOf:
          - $ref: '#/components/schemas/dateTime'
        in: query
        name: from
        required: false
        description: Start date of the requested period, with timezone offset (`Z` for UTC).
      - schema:
          allOf:
          - $ref: '#/components/schemas/dateTime'
        in: query
        name: to
        required: false
        description: End date of the requested period, with timezone offset (`Z` for UTC).
      - schema:
          type: string
        in: query
        name: cursor
        required: false
        description: 'GBP wallets only: `meta.pagination.nextCursor` from the previous page.'
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - wallet-load:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: false
                type: object
                properties:
                  meta:
                    description: Meta object describing pagination
                    type: object
                    properties:
                      pagination:
                        type: object
                        unevaluatedProperties: false
                        allOf:
                        - $ref: '#/components/schemas/pagination'
                        properties:
                          hasNextPage:
                            type: boolean
                          nextCursor:
                            type: string
                            nullable: true
                          nextUrl:
                            type: string
                            nullable: true
                    required:
                    - pagination
                  data:
                    description: Wallet loads list
                    type: array
                    items:
                      $ref: '#/components/schemas/walletLoad'
                required:
                - meta
                - data
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
  /v1/wallet-summary:
    get:
      operationId: v1-get-wallet-summary
      summary: Get Wallet Summary
      tags:
      - Settlements and wallet
      description: '**Allowed Scopes**: _`wallet-summary:read`_


        Return the details of the wallet (Spendesk entity), such as company name, remaining amounts, etc. Wallet summary data is cached for up to 20 minutes. Changes, including those made through the API, can take up to 20 minutes to appear.'
      parameters:
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - wallet-summary:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/walletSummary'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
components:
  schemas:
    settlement:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          description: The ID of the settlement.
        version:
          type: number
          description: Version of the settlement.
        type:
          type: string
          enum:
          - payment
          - refund
          - advance
          - cashReturn
          - chargeback
          - reimbursement
          description: "Indicates the type of the settlement. \n\nType | Description |\n---------|----------|\n `payment` | A payment to a supplier | \n `reimbursement` | A payment to an employee | \n `refund` | A refund |\n  `advance` | A cash advance |\n  `cashReturn` | A cash return |\n  `chargeback` | A card disputes/chargeback |\""
        medium:
          type: string
          enum:
          - card
          - wiretransfer
          description: The medium as through which this settlement is processed.
        paidFrom:
          type: string
          enum:
          - spendeskAccount
          - externalAccount
          description: The bank account the wire transfer is emitted from (Spendesk or external). For card payments the value is always `spendeskAccount`.
        transactionDescription:
          type: string
          description: Description of the transaction.
        clearedAt:
          allOf:
          - $ref: '#/components/schemas/dateTime'
          description: Time and date that the transaction cleared. In the [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date format.
        amount:
          allOf:
          - $ref: '#/components/schemas/priceAmount'
          description: If the payment was made in a foreign currency, this amount is in the foreign currency. Expressed in smallest units of the currency (e.g. cents for EUR and USD, but yen for JPY). Contains negative values for refunds.
        currency:
          $ref: '#/components/schemas/currency'
        billingAmount:
          allOf:
          - $ref: '#/components/schemas/priceAmount'
          description: Amount is in the account's currency. Expressed in smallest units of the currency (e.g. cents for EUR and USD, but yen for JPY).
        billingCurrency:
          $ref: '#/components/schemas/currency'
        billingExchangeRate:
          type: number
          description: If the payment was made in a foreign currency, this is the exchange rate between the two currencies at the time of the payment.
        state:
          type: string
          enum:
          - created
          - exported
          - failedToExport
          description: "Indicates the current state of the settlement: created, exported, or failed to export. \n\nType | Description |\n---------|----------|\n `created` | Created but not exported | \n `exported` | Exported | \n `failedToExport` | Tried to export but failed |\""
        exportedAt:
          oneOf:
          - $ref: '#/components/schemas/dateTime'
          - type: object
            nullable: true
          description: The date and time the settlement was exported at.
        statusUpdatedAt:
          oneOf:
          - $ref: '#/components/schemas/dateTime'
          - type: object
            nullable: true
          description: The date and time the settlement status was updated.
        allocations:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              amount:
                $ref: '#/components/schemas/priceAmount'
              currency:
                $ref: '#/components/schemas/currency'
              payableId:
                allOf:
                - $ref: '#/components/schemas/payable/properties/id'
                description: The ID of the associated payable.
            required:
            - amount
            - currency
            - payableId
          description: 'Allocations this settlement is part of, with at most one entry per payableId: if a settlement has several allocations to the same payable only one is returned, so allocation amounts may not add up to the settlement amount.'
      required:
      - id
      - version
      - type
      - medium
      - paidFrom
      - transactionDescription
      - clearedAt
      - amount
      - currency
      - billingAmount
      - billingCurrency
      - billingExchangeRate
      - state
      - exportedAt
      - statusUpdatedAt
      - allocations
      title: settlement
    currency:
      type: string
      pattern: ^[A-Z]{3}$
      description: If the payment was made in a foreign currency, this amount will be the one in the payment currency. Three-letter [ISO currency codes](https://www.iso.org/iso-4217-currency-codes.html).
      title: currency
    unauthorized:
      type: object
      description: Unauthorized
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                - AUTHENTICATION_ERROR
              detail:
                type: string
            required:
            - code
            - detail
      required:
      - errors
      title: unauthorized
    serviceUnavailableError:
      type: object
      description: Service Unavailable
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              code:
                type: string
                enum:
                - SERVICE_UNAVAILABLE_ERROR
              detail:
                type: string
            required:
            - code
            - detail
      required:
      - errors
      title: serviceUnavailableError
    tooManyRequests:
      type: object
      description: Too Many Requests
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            additionalProperties: false
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
              detail:
                type: string
            required:
            - code
            - detail
      required:
      - errors
      title: tooManyRequests
    internalServerError:
      type: object
      description: Internal Server Error
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
              detail:
                type: string
                enum:
                - Sorry, something has gone wrong at our end. If this persists please contact support.
            required:
            - code
            - detail
      required:
      - errors
      title: internalServerError
    meta:
      description: Meta object describing pagination
      type: object
      properties:
        pagination:
          type: object
          unevaluatedProperties: false
          allOf:
          - $ref: '#/components/schemas/pagination'
      required:
      - pagination
      title: meta
