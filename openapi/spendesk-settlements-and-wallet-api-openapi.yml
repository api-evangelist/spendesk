          minLength: 1
          description: The ID of the settlement.
        outcome:
          type: string
          enum:
          - notUpdated
          example: notUpdated
        reason:
          type: string
          description: The settlement or its accounting export state could not be found.
          enum:
          - notFound
          example: notFound
      required:
      - id
      - outcome
      - reason
      title: updateSettlementStateFailure
    forbidden:
      type: object
      description: Forbidden
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              code:
                type: string
                enum:
                - FORBIDDEN_ERROR
              detail:
                type: string
            required:
            - code
            - detail
      required:
      - errors
      title: forbidden
    notFound:
      type: object
      description: Not Found
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            additionalProperties: false
            type: object
            properties:
              code:
                type: string
