      - schema:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        in: query
        name: endDate
        required: false
        description: Return transactions on or before this date (YYYY-MM-DD), inclusive of the full day. Filters on the payment settlement date (returned as createdAt).
      - schema:
          type: string
        in: query
        name: userId
        required: false
        description: Filter by user ID.
      - schema:
          type: string
        in: query
        name: cardId
        required: false
        description: Filter by card ID.
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
