      - schema:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        in: query
        name: startDate
        required: false
        description: Return transactions on or after this date (YYYY-MM-DD).
      - schema:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        in: query
        name: endDate
        required: false
        description: Return transactions on or before this date (YYYY-MM-DD), inclusive of the full day.
