      - schema:
          type: integer
          default: 1
          minimum: 1
        in: query
        name: page
        required: false
        description: Page number
      - schema:
          type: integer
          default: 30
          minimum: 1
          maximum: 30
        in: query
        name: pageSize
        required: false
        description: Page size
      - schema:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        in: query
        name: startDate
        required: false
