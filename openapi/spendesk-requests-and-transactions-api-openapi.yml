                        status:
                          type: string
                          enum:
                          - failed
                        amountBilled:
                          type: number
                          description: In currencyBilled, the currency of the card the payment was attempted on, not the transaction's own spending currency (that is currencyDeclared).
                        amountDeclared:
                          type: number
                          description: In the transaction's own declared currency (currencyDeclared), not necessarily the company's functional currency.
                        cardId:
                          type: string
                        createdAt:
                          type: string
                          description: When the declined transaction was recorded.
                        currencyBilled:
                          type: string
                        currencyDeclared:
                          type: string
                        fxFeeAmount:
                          type: number
