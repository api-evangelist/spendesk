                        amountBilled:
                          type: number
                          description: In currencyBilled, the company's Spendesk account currency — the same on every record (normally but not always the functional currency).
                        amountDeclared:
                          type: number
                          description: In the transaction's own declared currency (currencyDeclared), not necessarily the company's functional currency.
                        cardId:
                          type:
                          - 'null'
                          - string
                        createdAt:
                          type: string
                          description: The settlement (paid) date, or the payment's creation date when it has no settlement date.
                        currencyBilled:
                          type: string
                        currencyDeclared:
                          type: string
                        fxFeeAmount:
                          type: number
                        merchantName:
