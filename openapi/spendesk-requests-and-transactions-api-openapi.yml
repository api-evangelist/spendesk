  /v1/transactions/successful:
    get:
      operationId: v1-get-successful-transactions
      summary: Get Successful Transactions
      tags:
      - Requests and transactions
      description: '**Allowed Scopes**: _`experimental:transaction:read`_

        Returns successful (settled) card transactions for the authenticated company, with pagination. For declined transactions, use `GET /v1/transactions/failed` instead; for a complete view across both statuses in a period, call both endpoints and merge the results. `merchantName` here is derived from the linked supplier''s name, not a raw card-network descriptor — it is not directly comparable to `merchantName` on failed transactions. `createdAt` is the settlement (paid) date, or the payment''s creation date when it has no settlement date. `startDate`/`endDate` filter on the settlement date only, so settled payments without a settlement date are excluded from date-filtered results (they are returned only when no date filter is set) — a date-filtered list can undercount a period. CURRENCY WARNING: `amountBilled` and `fxFeeAmount` are in `currencyBilled`, the company''s Spendesk account currency — identical on every record, so they can be totalled; `amountDeclared` is in `currencyDeclared`, the merchant''s spending currency, which varies per record — avoid summing it across records with different currencies.'
