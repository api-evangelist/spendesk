          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: 'null'
                  data:
                    description: List of failed transactions
                    type: array
                    items:
                      type: object
                      description: 'Money fields are integers in the smallest unit of their currency (cents for EUR, yen for JPY): amountDeclared is in currencyDeclared; amountBilled, fxFeeAmount and cardBalanceAtTransaction are in currencyBilled.'
                      properties:
                        id:
