                  meta:
                    $ref: '#/components/schemas/meta'
                  data:
                    description: List of successful transactions
                    type: array
                    items:
                      type: object
                      description: 'Money fields are integers in the smallest unit of their currency (cents for EUR, yen for JPY): amountDeclared is in currencyDeclared; amountBilled and fxFeeAmount are in currencyBilled.'
