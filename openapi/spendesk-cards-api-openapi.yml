  /v1/cards/{cardId}/blocking-history:
    get:
      operationId: v1-get-card-blocking-history
      summary: Get a Card Blocking History
      tags:
      - Cards
      description: '**Allowed Scopes**: _`experimental:card:read`_


        Returns the full block/unblock history for a card, regardless of its current status — every reason on the card, active and past, not just the current one. `endedAt` null means the reason is still active; several entries can carry a null `endedAt` at the same time, because a card can be blocked for several reasons at once. An empty history is a normal 200 with an empty array, not a 404.'
      parameters:
      - schema:
          type: string
        in: path
        name: cardId
        required: true
        description: The ID of the card.
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:card:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        initiator:
                          type: string
                          enum:
                          - user
                          - support
                          - scheduledDeactivation
                          - automatic
                          - controlRule
                          - internal
                        blockerId:
                          type:
                          - 'null'
                          - string
                        createdAt:
                          type: string
                        endedAt:
                          type:
                          - 'null'
                          - string
                      required:
                      - id
                      - initiator
                      - blockerId
                      - createdAt
                      - endedAt
                required:
                - data
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
  /v1/cards/{cardId}/order:
    get:
      operationId: v1-get-card-order
      summary: Get a Card Order
      tags:
      - Cards
      description: '**Allowed Scopes**: _`experimental:card:read`_


        Returns physical card order/shipping info for a card, regardless of its current status. 404 when no order is on file (always the case for a virtual card), but also when the card does not exist, belongs to another company, or is not visible to the caller.'
      parameters:
      - schema:
          type: string
        in: path
        name: cardId
        required: true
        description: The ID of the card.
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:card:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      cardId:
                        type: string
                      state:
                        type: string
                        enum:
                        - to_pickup
                        - to_ship
                        - shipped
                      city:
                        type:
                        - 'null'
                        - string
                      country:
                        type:
                        - 'null'
                        - string
                      trackingLink:
                        type:
                        - 'null'
                        - string
                      shippedAt:
                        type:
                        - 'null'
                        - string
                      receivedAt:
                        type:
                        - 'null'
                        - string
                      createdAt:
                        type: string
                      consideredAsLost:
                        type: boolean
                        description: 'Computed at read time, not stored: true when receivedAt is null and the order was placed more than 30 days ago. receivedAt is not reliably recorded, so this is only a possible delivery-delay signal while the card is still Pre-activated; ignore it once the card is Active, Blocked or Ready. Not the card''s own Lost status — never report the card as lost or the shipment as delayed from it; read the card''s status for that.'
                      estimatedReceivedAt:
                        type:
                        - 'null'
                        - string
                    required:
                    - id
                    - cardId
                    - state
                    - createdAt
                    - consideredAsLost
                required:
                - data
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
