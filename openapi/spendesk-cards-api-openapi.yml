openapi: 3.2.0
info:
  title: Spendesk Public Cards API
  description: Spendesk Public API
  version: '1.0'
  summary: Spendesk Public API
  contact:
    email: support-public-api@spendesk.com
    url: https://developer.spendesk.com/
    name: Spendesk for Developers
  termsOfService: https://www.spendesk.com/en/legals/terms/api-agreement
servers:
- url: https://public-api.spendesk.com
  description: Production
- url: https://public-api.demo.spendesk.com
  description: Sandbox
tags:
- name: Cards
  description: 'Experimental: cards, their blocking history, and the order of a physical card.'
paths:
  /v1/cards:
    get:
      operationId: v1-get-cards
      summary: Get Cards
      tags:
      - Cards
      description: '**Allowed Scopes**: _`experimental:card:read`_


        Returns cards for the authenticated company. Lost, stolen, damaged, expired and cancelled cards are not listed.'
      parameters:
      - schema:
          type: integer
          default: 1
          minimum: 1
        in: query
        name: page
        required: false
        description: Page number
      - schema:
          type: integer
          default: 30
          minimum: 1
          maximum: 30
        in: query
        name: pageSize
        required: false
        description: Page size
      - schema:
          type: string
          enum:
          - single_purchase
          - subscription
          - physical
          - multi_use
        in: query
        name: type
        required: false
        description: Filter by card type.
      - schema:
          type: string
        in: query
        name: status
        required: false
        description: 'Filter by card status label, case-sensitive: `Active`, `Blocked`, `New`, `Ready`, `Pre-activated`, `Hidden`, `Unknown` or `Aborted`. The legacy raw code (for example `ACT` or `BLO`) also matches. Lost, stolen, damaged, expired and cancelled cards are never listed, so filtering on those statuses returns no cards.'
      - schema:
          type: string
        in: query
        name: userId
        required: false
        description: Filter by card owner user ID.
      - schema:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        in: query
        name: createdAfter
        required: false
        description: Return cards created on or after this date (YYYY-MM-DD, UTC).
      - schema:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        in: query
        name: createdBefore
        required: false
        description: Return cards created on or before this date (YYYY-MM-DD, UTC).
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:card:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/meta'
                  data:
                    description: List of cards
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        status:
                          type: string
                          description: 'Card status label: `Active`, `Blocked`, `New`, `Ready`, `Pre-activated`, `Hidden`, `Unknown`, `Aborted`, `Lost`, `Stolen`, `Damaged`, `Expired` or `Cancelled`. A status code with no label is returned as the raw code, so treat unknown values as possible.'
                        lastFourDigits:
                          type:
                          - 'null'
                          - string
                        expiryDate:
                          type:
                          - 'null'
                          - string
                          description: Expiry date printed on the card, set by the card provider. For multi-use cards this is NOT the date the card stops working — use multiUseCardExpiryDate instead.
                        multiUseCardExpiryDate:
                          type: string
                          description: 'Expiration date of a multi-use card (ISO 8601 datetime): the end date chosen by the requester when the card was requested. Choosing an end date is mandatory when requesting a multi-use card, so this is set on every card of type multi_use; it is absent on all other card types. For multi-use cards it is the single source of truth for expiration — the date the card actually stops being usable — and always takes precedence over expiryDate.'
                        currency:
                          type: string
                        availableBalance:
                          type: number
                          description: What the card can spend right now, in `currency`, as a decimal in major units (12.5 means 12.50), not minor units.
                        spendingLimit:
                          type:
                          - 'null'
                          - number
                          description: The card's monthly budget, in `currency`, as a decimal in major units (12.5 means 12.50), not minor units. Null when no monthly budget is set.
                        owner:
                          type:
                          - 'null'
                          - object
                          properties:
                            id:
                              type: string
                            label:
                              type: string
                          required:
                          - id
                          - label
                        company:
                          type:
                          - 'null'
                          - object
                          properties:
                            id:
                              type: string
                            label:
                              type: string
                          required:
                          - id
                          - label
                        supplier:
                          type:
                          - 'null'
                          - object
                          properties:
                            id:
                              type: string
                            label:
                              type: string
                          required:
                          - id
                          - label
                        costCenter:
                          type:
                          - 'null'
                          - object
                          properties:
                            id:
                              type: string
                            label:
                              type: string
                          required:
                          - id
                          - label
                        request:
                          type:
                          - 'null'
                          - object
                          properties:
                            id:
                              type: string
                            label:
                              type: string
                            amount:
                              type: number
                            currency:
                              type: string
                          required:
                          - id
                          - label
                          - amount
                          - currency
                          description: 'The originating request behind this virtual card: id, label, and the amount/currency the requester declared when creating it. amount and currency are in the requester''s chosen (declared) currency, which may differ from the card''s top-level currency and availableBalance — those are always in the company''s currency. amount is a decimal in major units (12.5 means 12.50), not minor units. Null when the card has no linked request or when the request lookup failed — the two are not distinguished, and a failed lookup also nulls supplier and costCenter.'
                        recurrence:
                          type:
                          - 'null'
                          - string
                          enum:
                          - MONTHLY
                          - YEARLY
                          - WEEKLY
                          - QUARTERLY
                          - null
                          description: Payment recurrence of the subscription, normally null for non-subscription cards. MONTHLY is also the fallback when the recurrence could not be resolved (no linked request, no interval on it, or a failed lookup), so it is not a confirmed cadence.
                        createdAt:
                          type: string
                        lastSuccessfulPaymentTime:
                          type:
                          - 'null'
                          - string
                          description: 'Timestamp of the last settled card payment. Explicit null means confirmed: the card has never had one. The field being absent from the response instead means the lookup temporarily failed and the status is unknown — do not treat a missing field as null.'
                        cardOrder:
                          type:
                          - 'null'
                          - object
                          properties:
                            id:
                              type: string
                            cardId:
                              type: string
                            state:
                              type: string
                              enum:
                              - to_pickup
                              - to_ship
                              - shipped
                            city:
                              type:
                              - 'null'
                              - string
                            country:
                              type:
                              - 'null'
                              - string
                            trackingLink:
                              type:
                              - 'null'
                              - string
                            shippedAt:
                              type:
                              - 'null'
                              - string
                            receivedAt:
                              type:
                              - 'null'
                              - string
                            createdAt:
                              type: string
                            consideredAsLost:
                              type: boolean
                              description: 'Computed at read time, not stored: true when receivedAt is null and the order was placed more than 30 days ago. receivedAt is not reliably recorded, so this is only a possible delivery-delay signal while the card is still Pre-activated; ignore it once the card is Active, Blocked or Ready. Not the card''s own Lost status — never report the card as lost or the shipment as delayed from it; read the card''s status for that.'
                            estimatedReceivedAt:
                              type:
                              - 'null'
                              - string
                          required:
                          - id
                          - cardId
                          - state
                          - createdAt
                          - consideredAsLost
                          description: 'Physical card order/shipping info: state, city/country (not the full address), trackingLink, dates, consideredAsLost, estimatedReceivedAt. Only populated for physical cards while pre-activated (status Pre-activated); null or absent otherwise — this does not mean the order info no longer exists after activation, see GET /v1/cards/:cardId/order for the status-independent lookup.'
                        blockingReason:
                          type:
                          - 'null'
                          - object
                          properties:
                            initiator:
                              type: string
                              enum:
                              - user
                              - support
                              - scheduledDeactivation
                              - automatic
                              - controlRule
                              - internal
                            userId:
                              type:
                              - 'null'
                              - string
                            firstName:
                              type:
                              - 'null'
                              - string
                            lastName:
                              type:
                              - 'null'
                              - string
                            createdAt:
                              type: string
                          required:
                          - initiator
                          - createdAt
                          description: 'The single highest-priority reason this card is blocked — a card can hold several blocking reasons at once, so clearing this one may leave it blocked; do not present it as the only reason or as a complete unblocking instruction. Who/what has it blocked: user (a teammate — see userId/firstName/lastName), support (Spendesk support, identity never disclosed), controlRule (a company-configured spending control rule — could require a receipt, description, supplier, cost center, or custom fields depending on the company''s rules; which rule and requirement is unmet is not exposed here), scheduledDeactivation (a recurring deactivation schedule configured for this physical card — reactivates automatically per that schedule), automatic (an automated process, no further detail exposed), or internal (an internal reason with no disclosable detail — contact the Spendesk support team for more information). Only populated while status is Blocked; null or absent otherwise. Use GET /v1/cards/:cardId/blocking-history for every reason on the card, active and past.'
                        subscriptionBudget:
                          type:
                          - 'null'
                          - object
                          properties:
                            currency:
                              type: string
                            budgetAmount:
                              type: number
                            availableAmount:
                              type: number
                            spentAmount:
                              type: number
                            spentPercent:
                              type: number
                          required:
                          - currency
                          - budgetAmount
                          - availableAmount
                          - spentAmount
                          - spentPercent
                          description: 'The subscription''s remaining budget as shown on the card in the product: budgetAmount (the declared budget), spentAmount (current billing period spend only, capped at budgetAmount), availableAmount (what is left of this period''s budget; 0 when at or over budget), and spentPercent (rounded whole number 0–100; 100 can also mean just under budget). When the declared currency differs from the company''s and the period''s spend in the company currency, FX fees included, exceeds the budget, spentAmount, availableAmount and spentPercent are all 0, which means over budget, not unused. Use the card''s transactions for actual spend. Amounts are in the subscription''s own declared currency (the currency field here), which may differ from the card''s top-level currency and availableBalance — those are always in the company''s currency. All amounts are decimals in major units (12.5 means 12.50), not minor units. Only populated for subscription cards; null or absent otherwise.'
                      required:
                      - id
                      - type
                      - status
                      - currency
                      - availableBalance
                      - createdAt
                required:
                - meta
                - data
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
