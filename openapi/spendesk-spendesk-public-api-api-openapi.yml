              type: string
            version:
              type: integer
          required:
          - id
          - companyId
          - version
      required:
      - event
      - data
      title: webhookSettlement
    dateTime:
      type: string
      format: date-time
      description: String containing a UTC datetime expressed in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format like `2023-05-12T14:06:40Z`.
      title: dateTime
    webhookPayable:
      type: object
      additionalProperties: false
      properties:
        event:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            timestamp:
