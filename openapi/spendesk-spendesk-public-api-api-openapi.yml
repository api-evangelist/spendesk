webhooks:
  payables-created:
    post:
      requestBody:
        description: Event linking to a newly created payable. Use `/v1/payables/{id}` to get the full details.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/webhookPayable'
      responses:
        '200':
          description: Return a 2xx status to indicate that the data was received successfully
      tags:
      - Spendesk Public API
      summary: Create payables created
      x-summary-source: derived
  payables-prepared:
    post:
      requestBody:
        description: Event linking to a payable that has been prepared (`eventType` is `prepared`). Use `/v1/payables/{id}` to get the full details.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/webhookPayable'
      responses:
        '200':
          description: Return a 2xx status to indicate that the data was received successfully
      tags:
      - Spendesk Public API
      summary: Create payables prepared
      x-summary-source: derived
  settlement-created:
    post:
      requestBody:
        description: Event linking to a newly created settlement. Use `/v1/settlements` to get the full details by filtering by id.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/webhookSettlement'
      responses:
        '200':
          description: Return a 2xx status to indicate that the data was received successfully
      tags:
      - Spendesk Public API
      summary: Create settlement created
      x-summary-source: derived
components:
  schemas:
    webhookEntity:
      type: string
      enum:
      - payables
      - settlements
      title: webhookEntity
    webhookSettlement:
      type: object
      additionalProperties: false
      properties:
        event:
          type: object
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            timestamp:
              $ref: '#/components/schemas/dateTime'
            entity:
              $ref: '#/components/schemas/webhookEntity'
            eventType:
              type: string
              enum:
              - created
          required:
          - entity
          - eventType
          - id
          - timestamp
        data:
          type: object
          additionalProperties: false
          properties:
