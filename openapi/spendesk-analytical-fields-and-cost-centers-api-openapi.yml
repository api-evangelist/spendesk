openapi: 3.2.0
info:
  title: Spendesk Public Analytical fields and cost centers API
  description: Spendesk Public API
  version: '1.0'
  summary: Spendesk Public API
  contact:
    email: support-public-api@spendesk.com
    url: https://developer.spendesk.com/
    name: Spendesk for Developers
  termsOfService: https://www.spendesk.com/en/legals/terms/api-agreement
servers:
- url: https://public-api.spendesk.com
  description: Production
- url: https://public-api.demo.spendesk.com
  description: Sandbox
tags:
- name: Analytical fields and cost centers
  description: 'Cost centers and analytical fields used to categorise spend. The `v1` endpoints read analytical fields and manage cost centers; the experimental `v2` endpoints also create, update and delete analytical fields and their values. Part of: Building an accounting integration.'
paths:
  /v1/analytical-fields:
    get:
      operationId: v1-get-analytical-fields
      summary: Get Analytical Fields
      tags:
      - Analytical fields and cost centers
      description: '**Allowed Scopes**: _`analytical-field:read`_


        Returns analytical fields existing (or archived) in the Spendesk entity (company). Analytical fields data are cached for up to 24 hours. Changes, including those made through the API, can take up to 24 hours to appear.'
      parameters:
      - schema:
          type: integer
          default: 1
          minimum: 1
        in: query
        name: page
        required: false
        description: Page number
      - schema:
          type: integer
          default: 30
          minimum: 1
          maximum: 30
        in: query
        name: pageSize
        required: false
        description: Page size
      - schema:
          type: boolean
          default: false
        in: query
        name: includeArchived
        required: false
        description: Include deleted fields
      - schema:
          type: array
          items:
            type: string
        in: query
        name: ids
        required: false
        description: Field IDs, exploded `(ids=1&ids=2)`
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - analytical-field:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/meta'
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        isArchived:
                          type: boolean
                      required:
                      - id
                      - name
                      - isArchived
                    description: Analytical fields list
                required:
                - meta
                - data
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
  /v1/analytical-fields/{fieldId}/values:
    get:
      operationId: v1-get-analytical-field-values
      summary: Get Analytical Values
      tags:
      - Analytical fields and cost centers
      description: '**Allowed Scopes**: _`analytical-field:read`_


        Returns values of the specified analytical field. Analytical field values data are cached for up to 24 hours. Changes, including those made through the API, can take up to 24 hours to appear.'
      parameters:
      - schema:
          type: integer
          default: 1
          minimum: 1
        in: query
        name: page
        required: false
        description: Page number
      - schema:
          type: integer
          default: 30
          minimum: 1
          maximum: 30
        in: query
        name: pageSize
        required: false
        description: Page size
      - schema:
          type: boolean
          default: false
        in: query
        name: includeArchived
        required: false
        description: Include archived values (retained for historical payables, not deleted)
      - schema:
          type: string
        in: path
        name: fieldId
        required: true
        description: Analytical field ID
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - analytical-field:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  meta:
                    $ref: '#/components/schemas/meta'
                  data:
                    type: array
                    items:
                      additionalProperties: false
                      type: object
                      properties:
                        id:
                          type: string
                        value:
                          type: string
                        isArchived:
                          type: boolean
                      required:
                      - id
                      - value
                      - isArchived
                    description: Analytical field values list
                required:
                - meta
                - data
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
  /v1/cost-centers:
    get:
      operationId: v1-get-cost-centers
      summary: Get Cost Centers
      tags:
      - Analytical fields and cost centers
      description: '**Allowed Scopes**: _`cost-center:read`_


        Returns cost centers of the Spendesk entity (company). Cost centers data are cached for up to 24 hours. Changes made through the API are returned by subsequent reads; changes made in Spendesk can take up to 24 hours to appear.'
      parameters:
      - schema:
          type: array
          items:
            type: string
            format: uuid
        in: query
        name: ids
        required: false
        description: Cost center IDs to filter by.
      - schema:
          type: boolean
          default: false
        in: query
        name: includeArchived
        required: false
        description: Whether to include archived cost centers in the response. Defaults to `false`.
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - cost-center:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Cost center ID
                        name:
                          type: string
                          description: Cost center name
                        owner:
                          type: string
                          description: Cost center owner ID
                        coOwnerIds:
                          type: array
                          items:
                            type: string
                          description: Cost center co-owner ID
                        isArchived:
                          type: boolean
                          description: Whether the cost center is archived
                      required:
                      - id
                      - name
                      - owner
                      - coOwnerIds
                      - isArchived
                required:
                - data
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
    post:
      operationId: v1-create-cost-centers
      summary: Create Cost Centers
      tags:
      - Analytical fields and cost centers
      description: '**Allowed Scopes**: _`cost-center:manage`_


        Create a new cost center.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: The name of the cost center.
                owner:
                  type: string
                  description: The ID of the user who will own the cost center.
                coOwnerIds:
                  type: array
                  items:
                    type: string
                  description: The IDs of the users who will be co-owners of the cost center.
              required:
              - name
              - owner
              - coOwnerIds
      parameters:
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - cost-center:manage
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  id:
                    type: string
                    description: The ID of the newly created cost center.
                  name:
                    type: string
                    description: The name of the cost center.
                  owner:
                    type: string
                    description: The ID of the user who will own the cost center.
                  coOwnerIds:
                    type: array
                    items:
                      type: string
                    description: The IDs of the users who will be co-owners of the cost center.
                required:
                - id
                - name
                - owner
                - coOwnerIds
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '409':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  outcome:
                    type: string
                    enum:
                    - notCreated
                    example: notCreated
                  reason:
                    type: string
                    enum:
                    - nameAlreadyExists
                    example: nameAlreadyExists
                required:
                - outcome
                - reason
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooLarge'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unsupportedMediaType'
        '422':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  outcome:
                    type: string
                    enum:
                    - notCreated
                    example: notCreated
                  reason:
                    type: string
                    enum:
                    - duplicateCoOwners
                    example: duplicateCoOwners
                required:
                - outcome
                - reason
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
  /v1/cost-centers/{costCenterId}:
    put:
      operationId: v1-update-cost-centers
