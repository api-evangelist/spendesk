components:
  schemas:
    tooLarge:
      type: object
      description: Payload Too Large
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            additionalProperties: false
            type: object
            properties:
              code:
                type: string
                enum:
                - LARGE_BODY_ERROR
              detail:
                type: string
                enum:
                - 'The request is too large for this endpoint: send a smaller body or a smaller file.'
            required:
            - code
            - detail
      required:
      - errors
      title: tooLarge
    analyticalFieldV2:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: The analytical field ID.
        name:
          type: string
          description: The analytical field name.
        isRequired:
          type: boolean
          description: Whether the field is mandatory.
        isSplittable:
          type: boolean
          nullable: true
          description: Whether the field is configured as splittable (stored setting). Does not indicate whether analytical split is enabled for the company.
        type:
          type: string
          enum:
          - list
          - boolean
          description: The field type.
        archivedAt:
          oneOf:
          - $ref: '#/components/schemas/dateTime'
          - type: 'null'
          description: ISO 8601 UTC timestamp of when the field was archived, or null.
        createdAt:
          oneOf:
          - $ref: '#/components/schemas/dateTime'
          - type: 'null'
          description: ISO 8601 UTC timestamp of when the field was created, or null.
        updatedAt:
          oneOf:
          - $ref: '#/components/schemas/dateTime'
          - type: 'null'
          description: ISO 8601 UTC timestamp of when the field was last updated, or null.
      required:
      - id
      - name
      - isRequired
      - isSplittable
      - type
      - archivedAt
      - createdAt
      - updatedAt
      title: analyticalFieldV2
    pagination:
      type: object
      properties:
        page:
          type: integer
          default: 1
          minimum: 1
          description: Page number
        pageSize:
          type: integer
          default: 30
          minimum: 1
          maximum: 30
          description: Page size
        total:
          type: integer
          minimum: 0
          description: Total amount of records for this collection
      required:
      - page
      - pageSize
      - total
      title: pagination
    analyticalFieldV2ValuesMeta:
      type: object
      additionalProperties: false
      properties:
        pagination:
          $ref: '#/components/schemas/analyticalFieldV2ValuesCursorPagination'
      required:
      - pagination
      title: analyticalFieldV2ValuesMeta
    analyticalFieldV2ValuesCursorPagination:
      type: object
      additionalProperties: false
      description: Forward-only cursor pagination metadata.
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          description: Maximum number of values requested for this page.
        hasNextPage:
          type: boolean
          description: Whether a further page exists. Equivalent to `nextCursor !== null`.
        nextCursor:
          type:
