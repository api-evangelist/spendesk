                properties:
                  outcome:
                    type: string
                    enum:
                    - notUpdated
                    example: notUpdated
                  reason:
                    type: string
                    enum:
                    - duplicateCoOwners
                    example: duplicateCoOwners
                required:
                - outcome
                - reason
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
    delete:
      operationId: v1-delete-cost-centers
      summary: Delete Cost Centers
      tags:
      - Analytical fields and cost centers
      description: '**Allowed Scopes**: _`cost-center:manage`_


        Delete an existing cost center.'
      parameters:
      - schema:
          type: string
        in: path
        name: costCenterId
        required: true
        description: ID of the cost center to delete.
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - cost-center:manage
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '204':
          description: Default Response
          content:
            application/json:
              schema: {}
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/conflict'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying.
