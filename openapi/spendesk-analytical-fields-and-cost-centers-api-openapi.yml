      description: '**Allowed Scopes**: _`cost-center:manage`_


        Update an existing cost center.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: The name of the cost center.
                owner:
                  type: string
                  description: The ID of the user who will own the cost center.
                coOwnerIds:
