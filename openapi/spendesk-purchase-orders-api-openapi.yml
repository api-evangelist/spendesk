openapi: 3.2.0
info:
  title: Spendesk Public Purchase orders API
  description: Spendesk Public API
  version: '1.0'
  summary: Spendesk Public API
  contact:
    email: support-public-api@spendesk.com
    url: https://developer.spendesk.com/
    name: Spendesk for Developers
  termsOfService: https://www.spendesk.com/en/legals/terms/api-agreement
servers:
- url: https://public-api.spendesk.com
  description: Production
- url: https://public-api.demo.spendesk.com
  description: Sandbox
tags:
- name: Purchase orders
  description: 'Experimental purchase orders: list, retrieve, create, cancel and close them, and download a purchase order''s document.'
paths:
  /v1/purchase-orders:
    get:
      operationId: v1-get-purchase-orders
      summary: Get Purchase Orders
      tags:
      - Purchase orders
      description: '**Allowed Scopes**: _`experimental:purchase-order:read`_


        Returns purchase orders. Purchase order data is cached for up to 2 hours. Changes made through the API are returned by subsequent reads; changes made in Spendesk can take up to 2 hours to appear.'
      parameters:
      - schema:
          type: integer
          default: 1
          minimum: 1
        in: query
        name: page
        required: false
        description: Page number
      - schema:
          type: integer
          default: 30
          minimum: 1
          maximum: 30
        in: query
        name: pageSize
        required: false
        description: Page size
      - schema:
          type: boolean
        in: query
        name: withItems
        required: false
        description: Whether to include line items in the response
      - schema:
          anyOf:
          - type: string
          - type: array
            items:
              type: string
        in: query
        name: supplierIds
        required: false
        description: Filter by supplier IDs
      - schema:
          anyOf:
          - type: string
            enum:
            - open
            - closed
            - cancelled
          - type: array
            items:
              type: string
              enum:
              - open
              - closed
              - cancelled
        in: query
        name: status
        required: false
        description: Filter by purchase order status
      - schema:
          anyOf:
          - type: string
          - type: array
            items:
              type: string
            maxItems: 100
        in: query
        name: companyIds
        required: false
        description: Filter by company IDs
      - schema:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        in: query
        name: createdFrom
        required: false
        description: Filter purchase orders created from this date (YYYY-MM-DD)
      - schema:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        in: query
        name: createdTo
        required: false
        description: Filter purchase orders created until this date (YYYY-MM-DD)
      - schema:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        in: query
        name: startDateFrom
        required: false
        description: Filter purchase orders with start date from this date (YYYY-MM-DD)
      - schema:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        in: query
        name: startDateTo
        required: false
        description: Filter purchase orders with start date until this date (YYYY-MM-DD)
      - schema:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        in: query
        name: endDateFrom
        required: false
        description: Filter purchase orders with end date from this date (YYYY-MM-DD)
      - schema:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        in: query
        name: endDateTo
        required: false
        description: Filter purchase orders with end date until this date (YYYY-MM-DD)
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:purchase-order:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/meta'
                  data:
                    description: List of purchase orders
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        status:
                          type: string
                          enum:
                          - open
                          - closed
                          - cancelled
                          description: Status of the purchase order
                        billingStatus:
                          type: string
                        deliveryStatus:
                          type: string
                        billingOverDeliveryStatus:
                          type: string
                        billing:
                          type: string
                        version:
                          type: number
                        amount:
                          type: object
                          properties:
                            amount:
                              type: number
                              description: Amount in the smallest currency unit (e.g., cents for USD)
                            currency:
                              type: string
                              description: ISO 4217 currency code (e.g., USD, EUR)
                              minLength: 3
                              maxLength: 3
                              pattern: ^[A-Z]{3}$
                            precision:
                              type: number
                              description: Number of decimal places (e.g., 2 for USD)
                          required:
                          - amount
                          - currency
                          - precision
                        netAmount:
                          type: object
                          properties:
                            amount:
                              type: number
                              description: Amount in the smallest currency unit (e.g., cents for USD)
                            currency:
                              type: string
                              description: ISO 4217 currency code (e.g., USD, EUR)
                              minLength: 3
                              maxLength: 3
                              pattern: ^[A-Z]{3}$
                            precision:
                              type: number
                              description: Number of decimal places (e.g., 2 for USD)
                          required:
                          - amount
                          - currency
                          - precision
                        billedAmount:
                          type: object
                          properties:
                            amount:
                              type: number
                              description: Amount in the smallest currency unit (e.g., cents for USD)
                            currency:
                              type: string
                              description: ISO 4217 currency code (e.g., USD, EUR)
                              minLength: 3
                              maxLength: 3
                              pattern: ^[A-Z]{3}$
                            precision:
                              type: number
                              description: Number of decimal places (e.g., 2 for USD)
                          required:
                          - amount
                          - currency
                          - precision
                        deliveredAmount:
                          type: object
                          properties:
                            amount:
                              type: number
                              description: Amount in the smallest currency unit (e.g., cents for USD)
                            currency:
                              type: string
                              description: ISO 4217 currency code (e.g., USD, EUR)
                              minLength: 3
                              maxLength: 3
                              pattern: ^[A-Z]{3}$
                            precision:
                              type: number
                              description: Number of decimal places (e.g., 2 for USD)
                          required:
                          - amount
                          - currency
                          - precision
                        spendingCommitmentId:
                          type: string
                        purchaseOrderNumber:
                          type: number
                        description:
                          type: string
                        startDate:
                          type: string
                          format: date
                          pattern: ^\d{4}-\d{2}-\d{2}$
                        endDate:
                          type: string
                          format: date
                          pattern: ^\d{4}-\d{2}-\d{2}$
                        supplierId:
                          type: string
                        requesterId:
                          type: string
                        invoices:
                          type: array
                          items:
                            type: object
                            properties:
                              invoiceRequestId:
                                type: string
                              invoiceNumber:
                                type: string
                              amount:
                                type: object
                                properties:
                                  amount:
                                    type: number
                                    description: Amount in the smallest currency unit (e.g., cents for USD)
                                  currency:
                                    type: string
                                    description: ISO 4217 currency code (e.g., USD, EUR)
                                    minLength: 3
                                    maxLength: 3
                                    pattern: ^[A-Z]{3}$
                                  precision:
                                    type: number
                                    description: Number of decimal places (e.g., 2 for USD)
                                required:
                                - amount
                                - currency
                                - precision
                              status:
                                type: string
                                enum:
                                - pending-approval
                                - in-review
                                - to-schedule
                                - paid
                              requestId:
                                type: string
                              paymentToScheduleId:
                                type: string
                              latestPaymentId:
                                type: string
                            required:
                            - invoiceRequestId
                            - invoiceNumber
                            - amount
                            - status
                        companyId:
                          type: string
                        teamId:
                          type:
                          - 'null'
                          - string
                        costCenterId:
                          type: string
                        requestId:
                          type: string
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              quantity:
                                type: number
                              unitPrice:
                                type: number
                                description: Price of one unit, in `currency`, as a decimal in major units (12.5 means 12.50). Unlike the `{amount, currency, precision}` objects on the purchase order, this is a plain decimal.
                              currency:
                                type: string
                              vatRate:
                                type:
                                - 'null'
                                - number
                            required:
                            - name
                            - quantity
                            - unitPrice
                            - currency
                            - vatRate
                        customFields:
                          type: array
                          items:
                            type: object
                            properties:
                              field:
                                type: object
                                properties:
                                  id:
                                    type: string
                                  name:
                                    type: string
                                required:
                                - id
                                - name
                              value:
                                type: object
                                properties:
                                  id:
                                    type: string
                                  value:
                                    type: string
                                required:
                                - id
                                - value
                            required:
                            - field
                            - value
                      required:
                      - id
                      - status
                      - version
                      - amount
                      - billedAmount
                      - deliveredAmount
                      - spendingCommitmentId
                      - purchaseOrderNumber
                      - startDate
                      - endDate
                      - supplierId
                      - requesterId
                      - invoices
                      - companyId
                      - requestId
                required:
                - meta
                - data
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
    post:
      operationId: v1-create-purchase-order
      summary: Create a purchase order
      tags:
      - Purchase orders
      description: '**Allowed Scopes**: _`experimental:purchase-order:write`_


        Create a purchase order.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                properties:
                  externalPONumber:
                    type: string
                  userId:
                    type: string
                  amount:
                    type: object
                    properties:
                      amount:
                        type: number
                        description: Amount in the smallest currency unit (e.g., cents for USD)
                      currency:
                        type: string
                        description: ISO 4217 currency code (e.g., USD, EUR)
                        minLength: 3
                        maxLength: 3
                        pattern: ^[A-Z]{3}$
                      precision:
                        type: number
                        description: Number of decimal places (e.g., 2 for USD)
                    required:
                    - amount
                    - currency
                    - precision
                  netAmount:
                    type: object
                    properties:
                      amount:
                        type: number
                        description: Amount in the smallest currency unit (e.g., cents for USD)
                      currency:
                        type: string
                        description: ISO 4217 currency code (e.g., USD, EUR)
                        minLength: 3
                        maxLength: 3
                        pattern: ^[A-Z]{3}$
                      precision:
                        type: number
                        description: Number of decimal places (e.g., 2 for USD)
                    required:
                    - amount
                    - currency
                    - precision
                  description:
                    type: string
                    maxLength: 255
                  costCenterId:
                    type: string
                  teamId:
                    type: string
                  startDate:
                    type: string
                    format: date-time
                  endDate:
                    type: string
                    format: date-time
                  customFieldAssociations:
                    type: array
                    items:
                      type: object
                      properties:
                        customFieldId:
                          type: string
                        customFieldValueId:
                          oneOf:
                          - type: string
                          - type: 'null'
                        value:
                          oneOf:
                          - type: string
                          - type: boolean
                          - type: 'null'
                      required:
                      - customFieldId
                  analyticalSplits:
                    type: array
                    items:
                      type: object
                      properties:
                        amount:
                          type: object
                          properties:
                            amount:
                              type: number
                              description: Amount in the smallest currency unit (e.g., cents for USD)
                            currency:
                              type: string
                              description: ISO 4217 currency code (e.g., USD, EUR)
                              minLength: 3
                              maxLength: 3
                              pattern: ^[A-Z]{3}$
                            precision:
                              type: number
                              description: Number of decimal places (e.g., 2 for USD)
                          required:
                          - amount
                          - currency
                          - precision
                        costCenterId:
                          oneOf:
                          - type: string
                          - type: 'null'
                        customFields:
                          type: array
                          items:
                            type: object
                            properties:
                              customFieldId:
                                type: string
                              customFieldValueId:
                                oneOf:
                                - type: string
                                - type: 'null'
                              value:
                                oneOf:
                                - type: string
                                - type: boolean
                                - type: 'null'
                            required:
                            - customFieldId
                        percentage:
                          type: number
                      required:
                      - amount
                      - percentage
                    default: []
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          maxLength: 255
                        quantity:
                          type: number
                          exclusiveMinimum: 0
                        unitPrice:
                          type: object
                          properties:
                            amount:
                              type: number
                              description: Amount in the smallest currency unit (e.g., cents for USD)
                            currency:
                              type: string
                              description: ISO 4217 currency code (e.g., USD, EUR)
                              minLength: 3
                              maxLength: 3
                              pattern: ^[A-Z]{3}$
                            precision:
                              type: number
                              description: Number of decimal places (e.g., 2 for USD)
                          required:
                          - amount
                          - currency
                          - precision
                        vatRate:
                          oneOf:
                          - type: number
                            minimum: 0
                      required:
                      - name
                      - quantity
                      - unitPrice
                    default: []
                  deliveryNotesExpected:
                    type: boolean
                required:
                - userId
                - amount
                - netAmount
                - costCenterId
                - startDate
                - endDate
                - customFieldAssociations
              - anyOf:
                - type: object
                  properties:
                    supplierId:
                      type: string
                  required:
                  - supplierId
                - type: object
                  properties:
                    supplierName:
                      type: string
                  required:
                  - supplierName
      parameters:
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:purchase-order:write
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema: {}
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooLarge'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unsupportedMediaType'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
