  /v2/companies/{companyId}/intakes/{id}:
    get:
      operationId: v2-get-company-intake
      summary: Get an intake
      tags:
      - Invoices and intakes
      description: '**Allowed Scopes**: _`experimental:intake:read`_


        Returns a single intake by id: everything List intakes returns for it, plus the received files in `documents` — the invoice, credit note or receipt itself, and any companion file that arrived with it. This is the only endpoint that returns `documents`.


        Each `downloadUrl` is pre-signed and expires at most 3 hours after the response was issued. Intake data is cached for up to 55 minutes, so a link you receive may already be part-way through those 3 hours. Download promptly, and fetch the intake again for a fresh link rather than storing one. Changes made through the API are returned by subsequent reads; changes made in Spendesk can take up to 55 minutes to appear.


        A deleted intake is not a 404: it is still returned, with status `deleted`, and its documents can still be downloaded. A 404 means this company has no intake with that id. A 403 means either the token is not for `companyId`, or the Spendesk user the API key was created by is not a Controller, Administrator or Account Owner of that company.'
      parameters:
      - schema:
          type: string
        in: path
        name: companyId
        required: true
        description: Company ID.
      - schema:
          type: string
        in: path
        name: id
        required: true
        description: Intake ID.
      security:
      - Authentication:
        - experimental:intake:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/intake'
