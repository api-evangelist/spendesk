      - payableId
      - attachments
      - createdAt
      - updatedAt
      title: invoice
    priceAmount:
      type: number
      description: 'If the payment was made in a foreign currency, this amount will be the one in the payment currency.

        Can contain a negative value in case of refunds.

        Expressed in smallest units of the currency (e.g. cents for EUR and USD, but yen for JPY).'
      title: priceAmount
    invoicesSummary:
      type: object
      additionalProperties: false
      description: Aggregate figures over all invoices matching the filters, returned by `GET /v2/companies/:companyId/invoices/summary`.
      properties:
        count:
          type: integer
          description: Total number of matching invoices, across all currencies.
        totalsByCurrency:
          type: array
          items:
            $ref: '#/components/schemas/currencyTotal'
          description: Amount totals broken down by currency — one entry per currency present in the matching set. Amounts are never summed across currencies. Empty when nothing matches.
      required:
      - count
      - totalsByCurrency
      title: invoicesSummary
