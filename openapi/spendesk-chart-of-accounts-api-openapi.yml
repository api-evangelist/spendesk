openapi: 3.2.0
info:
  title: Spendesk Public Chart of accounts API
  description: Spendesk Public API
  version: '1.0'
  summary: Spendesk Public API
  contact:
    email: support-public-api@spendesk.com
    url: https://developer.spendesk.com/
    name: Spendesk for Developers
  termsOfService: https://www.spendesk.com/en/legals/terms/api-agreement
servers:
- url: https://public-api.spendesk.com
  description: Production
- url: https://public-api.demo.spendesk.com
  description: Sandbox
tags:
- name: Chart of accounts
  description: 'Experimental chart of accounts: read, create, update, bulk-sync and archive accounts, set their purpose, and assign suppliers and employees to their accounts. Part of: Building an accounting integration.'
paths:
  /v1/experimental/accounts:
    get:
      operationId: v1-get-accounts
      summary: Get accounts
      tags:
      - Chart of accounts
      description: '**Allowed Scopes**: _`experimental:chart-of-accounts:read`_


        Returns accounts from accounting integrations. Account data is cached for up to 24 hours. Changes made through the API are returned by subsequent reads; changes made in Spendesk can take up to 24 hours to appear.'
      parameters:
      - schema:
          anyOf:
          - type: string
            enum:
            - bank
            - expense
            - tax
            - supplier
            - employee
            - reverseCharge
          - type: array
            items:
              type: string
              enum:
              - bank
              - expense
              - tax
              - supplier
              - employee
              - reverseCharge
            minItems: 1
        in: query
        name: type
        required: false
      - schema:
          type: boolean
        in: query
        name: includeArchived
        required: false
      - schema:
          type: string
        in: query
        name: searchTerm
        required: false
      - schema:
          type: string
        in: query
        name: code
        required: false
        description: Deprecated. Use searchTerm instead.
      - schema:
          type: integer
          minimum: 0
          default: 0
        in: query
        name: offset
        required: false
      - schema:
          type: string
          format: uuid
        in: query
        name: after
        required: false
      - schema:
          type: integer
          minimum: 0
        in: query
        name: fetch
        required: false
      - schema:
          type: integer
          minimum: 0
          default: 100
        in: query
        name: limit
        required: false
        description: Deprecated. Use fetch instead.
      - schema:
          type: number
        in: query
        name: taxRate
        required: false
      - schema:
          anyOf:
          - type: string
            enum:
            - company
            - spendesk
            - bankFees
          - type: array
            items:
              type: string
              enum:
              - company
              - spendesk
              - bankFees
            minItems: 1
        in: query
        name: purpose
        required: false
      - schema:
          type: boolean
        in: query
        name: isAvailable
        required: false
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:chart-of-accounts:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        description:
                          type: string
                          nullable: true
                        type:
                          type: string
                          enum:
                          - bank
                          - expense
                          - tax
                          - supplier
                          - employee
                          - reverseCharge
                        code:
                          type: string
                          nullable: true
                        creditCode:
                          type: string
                          nullable: true
                        auxiliaryCode:
                          type: string
                          nullable: true
                        externalId:
                          type: string
                          nullable: true
                        purpose:
                          type: string
                          enum:
                          - company
                          - spendesk
                          - bankFees
                          nullable: true
                        taxRate:
                          type: number
                          nullable: true
                        currency:
                          type: string
                          nullable: true
                        isAvailable:
                          type: boolean
                        isArchived:
                          type: boolean
                        companyId:
                          type: string
                        createdAt:
                          type: string
                        defaultFor:
                          type: string
                          enum:
                          - employee
                          - invoiceSupplier
                          - cardSupplier
                          - tax
                          - expense
                          nullable: true
                      required:
                      - id
                      - name
                      - description
                      - type
                      - code
                      - creditCode
                      - auxiliaryCode
                      - externalId
                      - purpose
                      - taxRate
                      - currency
                      - isAvailable
                      - isArchived
                      - companyId
                      - defaultFor
                  totalResults:
                    type: number
                  currentOffset:
                    type: number
                  currentFetch:
                    type: number
                required:
                - data
                - totalResults
                - currentOffset
                - currentFetch
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
    post:
      operationId: v1-create-account
      summary: Create account
      tags:
      - Chart of accounts
      description: '**Allowed Scopes**: _`experimental:chart-of-accounts:write`_


        Creates a new account for the selected account type. If the account has a code, is not archived, and a non-archived account of the same type has the same code, purpose, auxiliaryCode and taxRate (for reverseCharge: the same name, code and creditCode), that account is updated instead: every field you omit is cleared to null.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                description:
                  type: string
                  nullable: true
                code:
                  type: string
                  nullable: true
                  description: Required unless externalId is set.
                creditCode:
                  type: string
                  nullable: true
                auxiliaryCode:
                  type: string
                  nullable: true
                externalId:
                  type: string
                  nullable: true
                  description: Required unless code is set.
                purpose:
                  type: string
                  enum:
                  - company
                  - spendesk
                  - bankFees
                  nullable: true
                taxRate:
                  type: number
                  nullable: true
                currency:
                  type: string
                  nullable: true
                isAvailable:
                  type: boolean
                  description: 'Ignored: new accounts are always available, and writes never change availability.'
                  deprecated: true
                isArchived:
                  type: boolean
              required:
              - name
      parameters:
      - schema:
          type: string
          enum:
          - bank
          - expense
          - tax
          - supplier
          - employee
          - reverseCharge
        in: query
        name: type
        required: true
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:chart-of-accounts:write
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  item:
                    type: object
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      description:
                        type: string
                        nullable: true
                      type:
                        type: string
                        enum:
                        - bank
                        - expense
                        - tax
                        - supplier
                        - employee
                        - reverseCharge
                      code:
                        type: string
                        nullable: true
                      creditCode:
                        type: string
                        nullable: true
                      auxiliaryCode:
                        type: string
                        nullable: true
                      externalId:
                        type: string
                        nullable: true
                      purpose:
                        type: string
                        enum:
                        - company
                        - spendesk
                        - bankFees
                        nullable: true
                      taxRate:
                        type: number
                        nullable: true
                      currency:
                        type: string
                        nullable: true
                      isAvailable:
                        type: boolean
                      isArchived:
                        type: boolean
                      companyId:
                        type: string
                      createdAt:
                        type: string
                    required:
                    - id
                    - name
                    - description
                    - type
                    - code
                    - creditCode
                    - auxiliaryCode
                    - externalId
                    - purpose
                    - taxRate
                    - currency
                    - isAvailable
                    - isArchived
                    - companyId
                required:
                - item
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/conflict'
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooLarge'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unsupportedMediaType'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
    put:
      operationId: v1-sync-accounts
      summary: Bulk update accounts
      tags:
      - Chart of accounts
      description: '**Allowed Scopes**: _`experimental:chart-of-accounts:write`_


        Bulk syncs (creates or upserts) accounts for the selected account type. Each item replaces the stored account: an omitted description, code, creditCode, auxiliaryCode, externalId, purpose, taxRate or currency is cleared to null (an omitted externalId removes the ERP link). An item that carries the id of an archived account un-archives it unless it sets isArchived to true. An item without id that has a code and does not set isArchived to true updates the non-archived account of the same type with the same code, purpose, auxiliaryCode and taxRate (for reverseCharge: the same name, code and creditCode), if there is one. Items without id never match an archived account. For partial updates to existing accounts, use PATCH /v1/experimental/accounts.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                accounts:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      description:
                        type: string
                        nullable: true
                      code:
                        type: string
                        nullable: true
                        description: Required unless externalId is set.
                      creditCode:
                        type: string
                        nullable: true
                      auxiliaryCode:
                        type: string
                        nullable: true
                      externalId:
                        type: string
                        nullable: true
                        description: Required unless code is set.
                      purpose:
                        type: string
                        enum:
                        - company
                        - spendesk
                        - bankFees
                        nullable: true
                      taxRate:
                        type: number
                        nullable: true
                      currency:
                        type: string
                        nullable: true
                      isAvailable:
                        type: boolean
                        description: 'Ignored: new accounts are always available, and writes never change availability.'
                        deprecated: true
                      isArchived:
                        type: boolean
                    required:
                    - name
              required:
              - accounts
      parameters:
      - schema:
          type: string
          enum:
          - bank
          - expense
          - tax
          - supplier
          - employee
          - reverseCharge
        in: query
        name: type
        required: true
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:chart-of-accounts:write
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        description:
                          type: string
                          nullable: true
                        type:
                          type: string
                          enum:
                          - bank
                          - expense
                          - tax
                          - supplier
                          - employee
                          - reverseCharge
                        code:
                          type: string
                          nullable: true
                        creditCode:
                          type: string
                          nullable: true
                        auxiliaryCode:
                          type: string
                          nullable: true
                        externalId:
                          type: string
                          nullable: true
                        purpose:
                          type: string
                          enum:
                          - company
                          - spendesk
                          - bankFees
                          nullable: true
                        taxRate:
                          type: number
                          nullable: true
                        currency:
                          type: string
                          nullable: true
                        isAvailable:
                          type: boolean
                        isArchived:
                          type: boolean
                        companyId:
                          type: string
                        createdAt:
                          type: string
                      required:
                      - id
                      - name
                      - description
                      - type
                      - code
                      - creditCode
                      - auxiliaryCode
                      - externalId
                      - purpose
                      - taxRate
                      - currency
                      - isAvailable
                      - isArchived
                      - companyId
                required:
                - items
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/conflict'
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooLarge'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unsupportedMediaType'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
