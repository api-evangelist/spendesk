        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
    patch:
      operationId: v1-patch-accounts
      summary: Bulk patch accounts
      tags:
      - Chart of accounts
      description: '**Allowed Scopes**: _`experimental:chart-of-accounts:write`_


        Partially updates one or more existing accounts by id. Validation is all-or-nothing: if any item has no field to update (400) or any id is not found (404), the request fails and nothing is written. Once validated, each account is patched independently: successful updates are returned in `accounts`, and per-item failures are returned in `failed` so callers can retry only the failed ids. Use PUT /v1/experimental/accounts for bulk upsert by type and PUT /v1/experimental/accounts/set-purpose to assign account purposes.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                accounts:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      description:
                        type: string
                        nullable: true
                      code:
                        type: string
                        nullable: true
                      creditCode:
                        type: string
                        nullable: true
                      auxiliaryCode:
                        type: string
                        nullable: true
                      externalId:
                        type: string
                        nullable: true
                      taxRate:
                        type: number
                        nullable: true
                      currency:
                        type: string
                        nullable: true
                      isArchived:
                        type: boolean
                    required:
                    - id
              required:
              - accounts
      parameters:
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:chart-of-accounts:write
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  accounts:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        description:
                          type: string
                          nullable: true
                        type:
                          type: string
                          enum:
                          - bank
                          - expense
                          - tax
                          - supplier
                          - employee
                          - reverseCharge
                        code:
                          type: string
                          nullable: true
                        creditCode:
                          type: string
                          nullable: true
                        auxiliaryCode:
                          type: string
                          nullable: true
                        externalId:
                          type: string
                          nullable: true
                        purpose:
                          type: string
                          enum:
                          - company
                          - spendesk
                          - bankFees
                          nullable: true
                        taxRate:
                          type: number
                          nullable: true
                        currency:
                          type: string
                          nullable: true
                        isAvailable:
                          type: boolean
                        isArchived:
                          type: boolean
                        companyId:
                          type: string
                        createdAt:
                          type: string
                      required:
                      - id
                      - name
                      - description
                      - type
                      - code
                      - creditCode
                      - auxiliaryCode
                      - externalId
                      - purpose
                      - taxRate
                      - currency
                      - isAvailable
                      - isArchived
                      - companyId
                  failed:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                          format: uuid
                        reason:
                          type: string
                        statusCode:
                          type: number
                      required:
                      - id
                      - reason
                required:
                - accounts
                - failed
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/conflict'
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooLarge'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unsupportedMediaType'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
