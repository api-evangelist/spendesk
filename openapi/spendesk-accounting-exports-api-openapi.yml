openapi: 3.2.0
info:
  title: Spendesk Public Accounting exports API
  description: Spendesk Public API
  version: '1.0'
  summary: Spendesk Public API
  contact:
    email: support-public-api@spendesk.com
    url: https://developer.spendesk.com/
    name: Spendesk for Developers
  termsOfService: https://www.spendesk.com/en/legals/terms/api-agreement
servers:
- url: https://public-api.spendesk.com
  description: Production
- url: https://public-api.demo.spendesk.com
  description: Sandbox
tags:
- name: Accounting exports
  description: 'Experimental: generate purchase and bank journals from the company''s templates, download them, and check which entities are exported. Part of: Exporting accounting data.'
paths:
  /v1/experimental/integrations/export-status:
    get:
      operationId: v1-get-integrations-export-status
      summary: Get entity export status
      tags:
      - Accounting exports
      description: Returns entity IDs filtered by export status within the given date range. A maximum date range of 1 year is allowed. Export status data is cached for up to 24 hours. Changes, including those made through the API, can take up to 24 hours to appear.
      parameters:
      - schema:
          type: string
          enum:
          - payable
          - settlementAllocation
          - walletLoad
          - bankFee
        in: query
        name: entityType
        required: true
      - schema:
          type: string
          format: date-time
        in: query
        name: from
        required: false
        description: Start of the date range (ISO 8601). Defaults to now minus 2 months, or 2 months before `to` if `to` is provided.
      - schema:
          type: string
          format: date-time
        in: query
        name: to
        required: false
        description: End of the date range (ISO 8601). Defaults to now.
      - schema:
          type: string
          enum:
          - exported
          - notExported
        in: query
        name: status
        required: true
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:accounting-export:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  entityType:
                    type: string
                    enum:
                    - payable
                    - settlementAllocation
                    - walletLoad
                    - bankFee
                  entityIds:
                    type: array
                    items:
                      type: string
                required:
                - entityType
                - entityIds
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
  /v1/experimental/journals:
    post:
      operationId: v1-create-journal
      summary: Create an accounting export
      tags:
      - Accounting exports
      description: '**Allowed Scopes**: _`experimental:accounting-export:read`_ or _`experimental:accounting-export:write`_


        Either scope is accepted today. With `markEntriesAsExported: true`, the exported entries are marked as exported in Spendesk; in a future release, that will require the `experimental:accounting-export:write` scope.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/accountingExportQuery'
      parameters:
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:accounting-export:read
      - Authentication:
        - experimental:accounting-export:write
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  query:
                    $ref: '#/components/schemas/accountingExportQuery'
                  key:
                    type: string
                    format: uuid
                required:
                - query
                - key
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooLarge'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unsupportedMediaType'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
  /v1/experimental/journals/templates:
    get:
      operationId: v1-get-journal-templates
      summary: Get available journal templates
      tags:
      - Accounting exports
      description: '**Allowed Scopes**: _`experimental:accounting-export:read`_


        Returns available journal templates. Accounting software and journal template data are cached for up to 24 hours. Changes, including those made through the API, can take up to 24 hours to appear.'
      parameters:
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:accounting-export:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    id:
                      type: string
                      format: uuid
                      nullable: false
                    name:
                      type: string
                      nullable: false
                    type:
                      type: string
                      enum:
                      - purchase
                      - bank
                      nullable: false
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
  /v1/experimental/journals/{key}:
    get:
      operationId: v1-get-journal
      summary: Get a journal CSV content
      tags:
      - Accounting exports
      description: '**Allowed Scopes**: _`experimental:accounting-export:read`_


        Returns the requested journal CSV content. Journal content data is cached for up to 24 hours. Changes, including those made through the API, can take up to 24 hours to appear.'
      parameters:
      - schema:
          type: string
          enum:
          - purchase
          - bank
        in: query
        name: journalType
        required: true
      - schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        in: path
        name: key
        required: true
        description: Request UUID
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:accounting-export:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/conflict'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/exportFailed'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
components:
  schemas:
    tooLarge:
      type: object
      description: Payload Too Large
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            additionalProperties: false
            type: object
            properties:
              code:
                type: string
                enum:
                - LARGE_BODY_ERROR
              detail:
                type: string
                enum:
                - 'The request is too large for this endpoint: send a smaller body or a smaller file.'
            required:
            - code
            - detail
      required:
      - errors
      title: tooLarge
    forbidden:
      type: object
      description: Forbidden
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              code:
                type: string
                enum:
                - FORBIDDEN_ERROR
              detail:
                type: string
            required:
            - code
            - detail
      required:
      - errors
      title: forbidden
    unauthorized:
      type: object
      description: Unauthorized
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                - AUTHENTICATION_ERROR
              detail:
                type: string
            required:
            - code
            - detail
      required:
      - errors
      title: unauthorized
    notFound:
      type: object
      description: Not Found
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            additionalProperties: false
            type: object
            properties:
              code:
                type: string
                enum:
                - NOT_FOUND
              detail:
                type: string
            required:
            - code
            - detail
      required:
      - errors
      title: notFound
    unsupportedMediaType:
      type: object
      description: Unsupported Media Type
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            additionalProperties: false
            type: object
            properties:
              code:
                type: string
                enum:
                - UNSUPPORTED_MEDIA_TYPE_ERROR
              detail:
                type: string
                enum:
                - 'The Content-Type of the request is not supported: send application/json, or application/x-www-form-urlencoded where the endpoint documents it.'
            required:
            - code
            - detail
      required:
      - errors
      title: unsupportedMediaType
    serviceUnavailableError:
      type: object
      description: Service Unavailable
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              code:
                type: string
                enum:
                - SERVICE_UNAVAILABLE_ERROR
              detail:
                type: string
            required:
            - code
            - detail
      required:
      - errors
      title: serviceUnavailableError
    tooManyRequests:
      type: object
      description: Too Many Requests
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            additionalProperties: false
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
              detail:
                type: string
            required:
            - code
            - detail
      required:
      - errors
      title: tooManyRequests
    internalServerError:
      type: object
      description: Internal Server Error
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
              detail:
                type: string
                enum:
                - Sorry, something has gone wrong at our end. If this persists please contact support.
            required:
            - code
            - detail
      required:
      - errors
      title: internalServerError
    conflict:
      type: object
      description: Conflict
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            additionalProperties: false
            type: object
            properties:
              code:
                type: string
                enum:
                - CONFLICT_ERROR
              detail:
                type: string
            required:
            - code
            - detail
      required:
      - errors
      title: conflict
    exportFailed:
      type: object
      description: Unprocessable Entity
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            additionalProperties: false
            type: object
            properties:
              code:
                type: string
                enum:
                - EXPORT_FAILED
              detail:
                type: string
            required:
            - code
            - detail
      required:
      - errors
      title: exportFailed
    accountingExportQuery:
      type: object
      properties:
        from:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Period start date
        to:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Period end date, no more than 31 days from `from`
        userLanguage:
          type: string
          enum:
          - en-GB
          - fr
          - de
          default: en-GB
        includeAlreadyExportedPayables:
          default: false
          type: boolean
          description: Whether to include payables that have already been exported to accounting in the export results. When set to `false` (default), only payables not yet exported are included.
        markEntriesAsExported:
          default: false
          type: boolean
          description: Whether the entries included in the export should be marked as exported after the export is generated. When set to `false` (default), the export is generated without updating the bookkeeping status of the entries
        templates:
          type: object
          description: Accounting templates to use for the export
          properties:
            purchaseJournalTemplateId:
              type: string
              description: The ID of the template to use for the purchase journal
            bankJournalTemplateId:
              type: string
              description: The ID of the template to use for the bank journal
          additionalProperties: false
      required:
      - from
      - to
      additionalProperties: false
      title: accountingExportQuery
    badRequest:
      type: object
      description: Bad request
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            additionalProperties: false
            type: object
            properties:
              code:
                type: string
                enum:
                - BAD_REQUEST_INCORRECT_OR_MISSING_FIELD
                - RESPONSE_TOO_LARGE
              detail:
                type: string
              source:
                type: string
            required:
            - code
            - detail
            - source
      required:
      - errors
      title: badRequest
  securitySchemes:
    Authentication:
      type: oauth2
      description: 'A company-level token acts on the company it was issued for. An organisation-level token (experimental) acts on the companies of an organisation: send the target company in the `X-Company-Id` header on every call, except on `GET /v2/companies` and on `/v2/companies/{companyId}/…` routes, which carry the company in the path. See [Organisation-level access](/reference/organisation-level-access).'
      flows:
        clientCredentials:
          tokenUrl: /v1/auth/token
          scopes:
            analytical-field:read: Analytical Fields (Read)
            bank-fee:read: Spending Bank Fees (Read)
            cost-center:read: Cost Center (Read)
            cost-center:manage: Cost Center (Manage)
