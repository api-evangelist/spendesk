openapi: 3.2.0
info:
  title: Spendesk Public Suppliers API
  description: Spendesk Public API
  version: '1.0'
  summary: Spendesk Public API
  contact:
    email: support-public-api@spendesk.com
    url: https://developer.spendesk.com/
    name: Spendesk for Developers
  termsOfService: https://www.spendesk.com/en/legals/terms/api-agreement
servers:
- url: https://public-api.spendesk.com
  description: Production
- url: https://public-api.demo.spendesk.com
  description: Sandbox
tags:
- name: Suppliers
  description: 'Suppliers of a company: read them with `supplier:read`; create, update, archive and unarchive them with `experimental:supplier:manage`. Part of: Building an accounting integration.'
paths:
  /v1/experimental/suppliers/status:
    patch:
      operationId: v1-patch-suppliers-status
      summary: Archive/Unarchive Suppliers
      tags:
      - Suppliers
      description: '**Allowed Scopes**: _`experimental:supplier:manage`_


        Archives or unarchives suppliers.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              type: object
              properties:
                supplierIds:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 100
                  description: Supplier IDs to update. When omitted, the action applies to all company suppliers.
                isArchived:
                  type: boolean
                  description: Indicates new status of the supplier. `true` to archive, `false` to unarchive.
              required:
              - isArchived
      parameters:
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:supplier:manage
      x-roles:
      - controller
      - accountOwner
      responses:
        '200':
          description: Response for the PATCH suppliers/status endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/supplierStatusUpdateSuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooLarge'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unsupportedMediaType'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
  /v1/experimental/suppliers/{id}/status:
    patch:
      operationId: v1-patch-supplier-status
      summary: Archive/Unarchive Supplier
      tags:
      - Suppliers
      description: '**Allowed Scopes**: _`experimental:supplier:manage`_


        Archives or unarchives supplier by id.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              type: object
              properties:
                isArchived:
                  type: boolean
                  description: Indicates new status of the supplier. `true` to archive, `false` to unarchive.
              required:
              - isArchived
      parameters:
      - schema:
          type: string
        in: path
        name: id
        required: true
        description: ID of the supplier to update.
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:supplier:manage
      x-roles:
      - controller
      - accountOwner
      responses:
        '200':
          description: Response for the PATCH suppliers/status endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/supplierStatusUpdateSuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooLarge'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unsupportedMediaType'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
  /v1/suppliers:
    get:
      operationId: v1-get-suppliers
      summary: Get Suppliers
      tags:
      - Suppliers
      description: '**Allowed Scopes**: _`supplier:read`_


        Returns suppliers existing in the Spendesk entity (company). Supplier data is cached for up to 24 hours; supplier account data (used for `accountPayable`) is cached for up to 20 minutes. Changes made through the API are returned by subsequent reads; changes made in Spendesk can take up to 24 hours to appear.


        Pass `include=externalIds` to embed the IDs each supplier has in external systems (ERPs). It is opt-in because it costs one additional lookup per request.


        Filter with `externalIds` to return only the suppliers carrying given external IDs, optionally narrowed to one `provider`. Suppliers with no matching mapping are excluded, so an external ID that matches nothing yields an empty page rather than every supplier.'
      parameters:
      - schema:
          type: integer
          default: 1
          minimum: 1
        in: query
        name: page
        required: false
        description: Page number
      - schema:
          type: integer
          default: 30
          minimum: 1
          maximum: 30
        in: query
        name: pageSize
        required: false
        description: Page size
      - schema:
          type: array
          items:
            type: string
        in: query
        name: ids
        required: false
        description: Supplier IDs to filter by.
      - schema:
          type: string
        in: query
        name: search
        required: false
        description: Free-text supplier search, for example by supplier name.
      - schema:
          $ref: '#/components/schemas/dateTime'
        in: query
        name: updatedBefore
        required: false
      - schema:
          $ref: '#/components/schemas/dateTime'
        in: query
        name: updatedAfter
        required: false
      - schema:
          $ref: '#/components/schemas/dateTime'
        in: query
        name: createdBefore
        required: false
      - schema:
          $ref: '#/components/schemas/dateTime'
        in: query
        name: createdAfter
        required: false
      - schema:
          type: string
          pattern: ^[A-Z]{2}$
        in: query
        name: bankCountry
        required: false
        description: ISO alpha-2 code of the bank country
      - schema:
          type: string
        in: query
        name: iban
        required: false
        description: Supplier IBAN
      - schema:
          type: string
        in: query
        name: vatNumber
        required: false
        description: Supplier VAT number
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
        in: query
        name: isArchived
        required: false
        description: 'Selects one archive state and is not additive: true returns ONLY archived suppliers, false ONLY active ones. Omit it to get both — every row carries isArchived.'
      - schema:
          type: array
          maxItems: 50
          items:
            type: string
        in: query
        name: externalIds
        required: false
        description: Return only suppliers carrying one of these IDs in an external system (ERP). Resolved against the external-reference registry, so unmapped suppliers are excluded. Up to 50 per request.
      - schema:
          type: string
          minLength: 1
        in: query
        name: provider
        required: false
        description: Restrict the `externalIds` filter to one external system (e.g. Netsuite, Xero). Worth setting when a company has been connected to more than one ERP, since the same external ID string can exist in each. Ignored without that filter, and it does not narrow the `externalIds` include, which returns the IDs from every system (read `provider` on each entry).
      - schema:
          type: array
          items:
            type: string
            enum:
            - externalIds
        in: query
        name: include
        required: false
        description: Extra data to embed in the response. `externalIds` costs one additional lookup per request, so it is opt-in.
      - schema:
          type: string
          enum:
          - name
          - created_at
          - updated_at
        in: query
        name: sortBy
        required: false
        description: Field to sort suppliers by.
      - schema:
          type: string
          enum:
          - asc
          - desc
        in: query
        name: sort
        required: false
        description: Sort direction.
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - supplier:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/supplierResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
    post:
      operationId: v1-create-suppliers
      summary: Create Supplier(s)
      tags:
      - Suppliers
      description: '**Allowed Scopes**: _`experimental:supplier:manage`_


        Create one or multiple suppliers. Send an array of 1 to 100 supplier objects; a single object outside an array is rejected with a 400. A one-item array returns `item`; two or more return `items`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/supplierToCreate'
              description: Array of suppliers to create (minimum 1 item).
              minItems: 1
              maxItems: 100
        description: Array of suppliers to create (minimum 1 item).
      parameters:
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:supplier:manage
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  properties:
                    item:
                      $ref: '#/components/schemas/supplierInfoBase'
                  required:
                  - item
                - $ref: '#/components/schemas/bulkCreateSuppliersResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooLarge'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unsupportedMediaType'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
    patch:
      operationId: v1-update-suppliers
      summary: Update Suppliers
      tags:
      - Suppliers
      description: '**Allowed Scopes**: _`experimental:supplier:manage`_


        Update multiple suppliers. Accepts an array of supplier update objects (minimum 2 items), each containing an id field. For a single supplier use PATCH /v1/suppliers/:id.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/supplierToUpdateBulk'
              minItems: 2
              maxItems: 100
              description: Array of suppliers to update (minimum 2 items).
        description: Array of suppliers to update (minimum 2 items).
      parameters:
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:supplier:manage
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bulkUpdateSuppliersResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooLarge'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unsupportedMediaType'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
  /v1/suppliers/{id}:
    get:
      operationId: v1-get-supplier-by-id
      summary: Get Supplier By Id
      tags:
      - Suppliers
      description: '**Allowed Scopes**: _`supplier:read`_


        Retrieves a single supplier by its ID. Supplier data is cached for up to 24 hours; supplier account data (used for `accountPayable`) is cached for up to 20 minutes. Changes made through the API are returned by subsequent reads; changes made in Spendesk can take up to 24 hours to appear.


        Pass `include=externalIds` to embed the IDs this supplier has in external systems (ERPs). It is opt-in because it costs an additional lookup.'
      parameters:
      - schema:
          type: array
          items:
            type: string
            enum:
            - externalIds
        in: query
        name: include
        required: false
        description: Extra data to embed in the response.
      - schema:
          type: string
        in: path
        name: id
        required: true
        description: ID of the supplier to retrieve.
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - supplier:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/supplier'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
    patch:
      operationId: v1-update-supplier
      summary: Update Supplier
      tags:
      - Suppliers
      description: '**Allowed Scopes**: _`experimental:supplier:manage`_


        Update a single supplier by ID.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/supplierToUpdateSingle'
      parameters:
      - schema:
          type: string
        in: path
        name: id
        required: true
        description: ID of the supplier to update.
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:supplier:manage
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  item:
                    $ref: '#/components/schemas/supplierInfoBase'
                required:
                - item
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbiddenControllerRoleRequired'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooLarge'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unsupportedMediaType'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
components:
  schemas:
    unauthorized:
      type: object
      description: Unauthorized
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                - AUTHENTICATION_ERROR
              detail:
                type: string
            required:
            - code
            - detail
      required:
      - errors
      title: unauthorized
    serviceUnavailableError:
      type: object
      description: Service Unavailable
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              code:
                type: string
                enum:
                - SERVICE_UNAVAILABLE_ERROR
              detail:
                type: string
            required:
            - code
            - detail
      required:
      - errors
      title: serviceUnavailableError
    tooManyRequests:
      type: object
      description: Too Many Requests
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            additionalProperties: false
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
              detail:
                type: string
            required:
            - code
            - detail
      required:
      - errors
      title: tooManyRequests
    supplierToCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: The name of the supplier.
        primaryEmail:
          type: string
          description: The primary email of the supplier.
        supplierDetails:
          type: object
          additionalProperties: false
          properties:
            legalName:
              type: string
              description: The legal name of the supplier.
            registrationNumber:
              type: string
              description: The registration number of the supplier.
            vatNumber:
              type: string
              description: The VAT number of the supplier.
            address:
              type: string
              description: The address of the supplier.
            city:
              type: string
              description: The city of the supplier.
            zipcode:
              type: string
              description: The zipcode of the supplier.
            country:
              type: string
              description: The country of the supplier.
          required:
          - legalName
        bankInfo:
          type: object
          additionalProperties: false
          properties:
            iban:
              type: string
              description: The IBAN of the supplier.
            bic:
              type: string
              description: The BIC of the supplier.
            bankCountry:
              type: string
              description: The bank country of the supplier.
            accountNumber:
              type: string
              description: The account number of the supplier.
            routingNumber:
              type: string
              description: The routing number of the supplier.
            sortCode:
              type: string
              description: The sort code of the supplier.
            accountHolderName:
              type: string
              description: The account holder name of the supplier.
      required:
      - name
      - supplierDetails
      title: supplierToCreate
    internalServerError:
      type: object
      description: Internal Server Error
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              code:
                type: string
                enum:
