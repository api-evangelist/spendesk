    post:
      operationId: v1-create-payable-attachment-upload
      summary: Create Payable Attachment Upload
      tags:
      - Payables
      description: '**Allowed Scopes**: _`experimental:payable-attachment:write`_


        Creates a presigned upload target for a receipt attachment on a payable. This first version supports card transaction payables only. Upload the file using the returned method, URL, and form fields, then poll `GET /v1/payables/:payableId/attachments` until the attachment appears.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                mimeType:
                  type: string
                  minLength: 1
                  description: Media type of the attachment.
                contentLength:
                  type: integer
                  minimum: 1
                  description: Attachment size in bytes.
              required:
              - mimeType
              - contentLength
      parameters:
      - schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        example: bc9cef35-401d-4ea4-b384-ed725e6685cf
        in: path
        name: payableId
        required: true
        description: The ID of the Payable
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:payable-attachment:write
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  method:
                    type: string
                    enum:
                    - POST
                    description: HTTP method to use when uploading the attachment.
                  url:
                    type: string
                    description: Presigned URL where the attachment must be uploaded.
                  fields:
                    type: object
                    additionalProperties:
                      type: string
                    description: Form fields to send with the attachment upload.
                required:
                - method
                - url
                - fields
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooLarge'
        '415':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        code:
                          type: string
                          enum:
                          - UNSUPPORTED_MEDIA_TYPE
                        detail:
                          type: string
                      required:
                      - code
                      - detail
                required:
                - errors
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
  /v1/snapshots/payables:
    post:
      operationId: v1-create-snapshot-payables
      summary: Create a snapshot of payables
      tags:
      - Payables
      description: '**Allowed Scopes**: _`payable:read`_


        Request an extract (snapshot) of expenses to be created.


        A request to create a snapshot of expenses according to the filters provided will be queued, where a key (of format UUID) will be returned immediately, it being a reference to your request.


        This key can be used to check for the status of this request using the GET Snapshot Payable API call. Once its status is "COMPLETE", the list of payables is returned under the "result.data" element of the response.


        Requesting snapshots should be done sequentially and cannot be done simultaneously (in parallel). Requesting a new snapshot with exactly the same parameters will return the same key as long as the snapshot exists. Snapshots are typically cached for 10 hours.


        These two APIs (POST and GET) are implemented based on the asynchronous request-response pattern, decoupling long-running backend jobs from the synchronous nature of REST APIs.


        For more information about payables, see this guide.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/payableQuery'
      parameters:
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - payable:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  query:
                    $ref: '#/components/schemas/payableQuery'
                  key:
                    type: string
                    format: uuid
                    description: The key that can be used to query the [Get Snapshot Payable](/reference/v1-get-snapshot-payables) endpoint.
                  expireInSeconds:
                    type: number
                    description: The total number of seconds the snapshot of payables is available for.
                  remainingSeconds:
                    type: number
                    nullable: true
                    description: Remaining time to live of the snapshot. Typically 10 hours.
                required:
                - query
                - key
                - expireInSeconds
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/conflict'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
  /v1/snapshots/payables/{key}:
    get:
      operationId: v1-get-snapshot-payables
      summary: Get a snapshot of payables
      tags:
      - Payables
      description: '**Allowed Scopes**: _`payable:read`_


        Returns an extract (snapshot) of payables requested via the POST API. Requires the returned key as a parameter.


        Due to its asynchronous nature, we recommend to poll this endpoint ideally after 1 hour, or alternatively every 5 minutes until status is "COMPLETE" or "ERROR".


        The list of expenses is returned under "result.data" when its status is "COMPLETE". The response is paginated (30 payables per page), where the current page number is returned under "result.meta.pagination". Snapshots are typically cached for 10 hours.


        These two APIs (POST and GET) are implemented based on the asynchronous request-response pattern, decoupling long-running backend jobs from the synchronous nature of REST APIs.


        For more information about payables, see this guide.'
      parameters:
      - schema:
          $ref: '#/components/schemas/paginationQuery/properties/page'
        in: query
        name: page
        required: false
      - schema:
          type: string
          format: uuid
        in: path
        name: key
        required: true
        description: Key received from the response of [Create a Snapshot of Payables](/reference/v1-create-snapshot-payables).
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - payable:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: The snapshot status. Once the status is `COMPLETE`, `result.data` holds the requested page of payables.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                description: The snapshot status. Once the status is `COMPLETE`, `result.data` holds the requested page of payables.
                properties:
                  query:
                    $ref: '#/components/schemas/payableQuery'
                  result:
                    type: object
                    properties:
                      meta:
                        $ref: '#/components/schemas/meta'
                      data:
                        description: The array of payables
                        type: array
                        items:
                          $ref: '#/components/schemas/payable'
                  associated:
                    type: object
                    additionalProperties: false
                    properties:
                      companyId:
                        type: string
                        description: The ID of the company for which payables were requested for.
                      userId:
                        type: string
                        description: The user ID that requested the snapshot.
                      correlationId:
                        type: string
                        description: ID of the original request.
                    required:
                    - companyId
                    - userId
                    - correlationId
                  status:
                    type: string
                    enum:
                    - IN_PROGRESS
                    - ERROR
                    - COMPLETE
                    description: The current status of the snapshot preparation. In case `ERROR` is returned, the request should be retried.
                  remainingSeconds:
                    type: number
                    description: Remaining time to live of the snapshot.
                required:
                - query
                - result
                - associated
                - status
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
components:
  schemas:
    currency:
      type: string
      pattern: ^[A-Z]{3}$
      description: If the payment was made in a foreign currency, this amount will be the one in the payment currency. Three-letter [ISO currency codes](https://www.iso.org/iso-4217-currency-codes.html).
      title: currency
    searchPayableCompliances:
      type: object
      description: Country-specific compliance information (e.g. Spain e-receipt).
      properties:
        spainEreceipt:
          type: object
          properties:
            receipt:
              type: object
              properties:
                path:
                  type: string
                uniqueId:
                  type: string
              required:
              - path
              - uniqueId
              additionalProperties: false
            closure:
              type: object
              properties:
                closedAt:
                  type: string
                closingPeriod:
                  type: string
                error:
                  type: object
                  properties:
                    kind:
                      type: string
                    details: {}
                  required:
                  - kind
                  additionalProperties: false
              required:
              - closedAt
              - closingPeriod
              additionalProperties: false
          additionalProperties: false
      additionalProperties: false
      title: searchPayableCompliances
    unauthorized:
      type: object
      description: Unauthorized
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                - AUTHENTICATION_ERROR
              detail:
                type: string
            required:
            - code
            - detail
      required:
      - errors
      title: unauthorized
    serviceUnavailableError:
      type: object
      description: Service Unavailable
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              code:
                type: string
                enum:
                - SERVICE_UNAVAILABLE_ERROR
              detail:
                type: string
            required:
            - code
            - detail
      required:
      - errors
      title: serviceUnavailableError
    searchPayableAmountRangeOperand:
      type: object
      description: Amount filter with a range operator (between or notBetween).
      properties:
        operator:
          type: string
          enum:
          - between
          - notBetween
        value:
          type: object
          properties:
            from:
              type: number
            to:
              type: number
          required:
          - from
          - to
          additionalProperties: false
      required:
      - operator
      - value
      title: searchPayableAmountRangeOperand
    priceAmount:
      type: number
      description: 'If the payment was made in a foreign currency, this amount will be the one in the payment currency.

        Can contain a negative value in case of refunds.

        Expressed in smallest units of the currency (e.g. cents for EUR and USD, but yen for JPY).'
      title: priceAmount
    tooManyRequests:
      type: object
      description: Too Many Requests
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            additionalProperties: false
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
              detail:
                type: string
            required:
            - code
            - detail
      required:
      - errors
      title: tooManyRequests
    internalServerError:
      type: object
      description: Internal Server Error
      additionalProperties: false
      properties:
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
              detail:
                type: string
                enum:
                - Sorry, something has gone wrong at our end. If this persists please contact support.
            required:
            - code
            - detail
      required:
      - errors
      title: internalServerError
    searchPayableAmountOperand:
      anyOf:
      - $ref: '#/components/schemas/searchPayableAmountComparisonOperand'
      - $ref: '#/components/schemas/searchPayableAmountRangeOperand'
      title: searchPayableAmountOperand
    meta:
      description: Meta object describing pagination
      type: object
      properties:
        pagination:
          type: object
          unevaluatedProperties: false
          allOf:
          - $ref: '#/components/schemas/pagination'
      required:
      - pagination
      title: meta
    searchPayableDateOperand:
      anyOf:
      - type: string
        format: date-time
      - type: string
        enum:
        - today
      - type: string
        enum:
        - yesterday
      - type: string
        enum:
        - thisMonth
      - type: string
        enum:
        - lastMonth
      title: searchPayableDateOperand
    searchPayableDocEvidenceStatusFilter:
      description: Filter payables by documentary evidence status. `provided`/`providedAndDpr` mean a file is attached (user-set) — they do NOT certify that the document is a valid or compliant invoice; for actual validation read the payable's `documentaryEvidence.validity` field. `missing` and `declaredAsInvalid` indicate the receipt still needs follow-up.
      allOf:
      - type: object
        properties:
          field:
            type: string
            enum:
            - documentaryEvidenceStatus
        required:
        - field
      - type: object
        properties:
          operator:
            type: string
            enum:
            - '='
            - '!='
          value:
            anyOf:
            - type: 'null'
            - type: array
              items:
                type: string
                enum:
                - provided
                - providedAndDpr
                - missing
                - cannotBeProvided
                - declaredAsInvalid
                - hasDprError
                - hasDpr
              minItems: 1
            - type: string
              enum:
              - any
        required:
        - operator
        - value
      title: searchPayableDocEvidenceStatusFilter
    searchPayableDateInLastOperand:
      type: object
      description: Date filter with inLast operator specifying a relative time window.
      properties:
        operator:
          type: string
          enum:
          - inLast
        value:
          type: object
          properties:
            timeUnit:
              type: string
              enum:
              - days
              - months
              - years
            amount:
              type: number
          required:
          - timeUnit
          - amount
          additionalProperties: false
      required:
      - operator
      - value
      title: searchPayableDateInLastOperand
    searchPayable:
      description: 'A payable returned by the search endpoint. Discriminated union: either an expense or a reversal, identified by the kind field.'
      anyOf:
      - type: object
        description: An expense payable (kind = "expense").
        properties:
          id:
            type: string
            format: uuid
            description: Unique payable identifier.
            examples:
            - bc9cef35-401d-4ea4-b384-ed725e6685cf
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          state:
            type: string
            description: Bookkeeping lifecycle state of the payable.
            enum:
            - toPrepare
            - toExport
            - exported
          amount:
            allOf:
            - $ref: '#/components/schemas/searchPayableMoney'
            description: Original transaction amount in currency minor units.
          currency:
            type: string
            description: ISO 4217 currency code of the transaction amount.
          functionalAmount:
            allOf:
            - $ref: '#/components/schemas/searchPayableMoney'
            description: Amount in the company's functional currency, in minor units.
          functionalCurrency:
            type: string
            description: ISO 4217 currency code of the functional amount.
          outstandingAmount:
            allOf:
            - $ref: '#/components/schemas/searchPayableMoney'
            description: Portion of the payable amount not yet covered by allocations, in the payable native currency minor units. Zero means fully allocated. Absent if allocation tracking is unavailable for that payable.
          outstandingFunctionalAmount:
            allOf:
            - $ref: '#/components/schemas/searchPayableMoney'
            description: Same as outstandingAmount but in the company's functional currency minor units.
          creationDate:
            type: string
            format: date-time
            description: 'Issue date of the payable — the date on the underlying document: a supplier invoice''s issue date, or for card purchases the transaction''s settlement date. This is the payable''s accounting-relevant business date and the default basis for placing it in an accounting period. It is set during the request/review flow, is editable by controllers, and can be backdated, so it does NOT reflect when the record entered Spendesk (see firstCreatedAt for that). When the optional accounting-date override is enabled, accountingDate takes precedence for the booking period; otherwise accountingDate defaults to this date. To filter payables by this date, use the payableDate date-filter field (this same value is returned here as creationDate) — not firstCreatedAt, which is the system-entry timestamp.'
          memberId:
            type: string
            description: ID of the team member who owns this payable.
          version:
            type: number
            description: The current version of this payable. This is incremented every time the payable is modified.
          kind:
            type: string
            description: Discriminator. Always "expense" for this variant.
            enum:
            - expense
          subType:
            type: string
            description: Payment method or expense origin.
            enum:
            - expense
            - invoice
            - creditNote
            - singlePurchase
            - subscription
            - multiUseCard
            - physical
            - mileageAllowance
            - perDiemAllowance
          description:
            type: string
            description: Free-text description of the payable.
          dueDate:
            type: string
            format: date-time
            description: Payment due date, when applicable (e.g. invoices).
          accountPayableId:
            type: string
            format: uuid
            description: Linked accounts-payable entry ID.
          firstExportedAt:
            type: string
            format: date-time
            description: Timestamp of the first export to an accounting system.
          firstCreatedAt:
            type: string
            format: date-time
            description: Original creation timestamp (preserved across bookkeeping resets).
          accountingDate:
            type: string
            format: date-time
            description: Date used for the accounting period.
          amortisation:
            type: object
            description: Prepaid-expense amortisation schedule.
            properties:
              date:
                type: object
                properties:
                  from:
                    type: string
                  to:
                    type: string
                required:
                - from
                - to
                additionalProperties: false
            required:
            - date
            additionalProperties: false
          type:
            type: string
            description: 'Expense type: bill, claimedBill (employee-submitted), mileageExpense or perDiemExpense.'
            enum:
            - bill
            - claimedBill
            - mileageExpense
            - perDiemExpense
          spendingAmount:
            allOf:
            - $ref: '#/components/schemas/searchPayableMoney'
            description: Amount in the spending (card) currency, in minor units.
          spendingCurrency:
            type: string
            description: ISO 4217 currency code of the spending (card) amount.
          allocations:
            type: array
            description: Allocations linked to this expense. `settlement` entries are cash paid; `reversal` entries are a credit note or card refund applied document-to-document, not money moved.
            items:
              type: object
              properties:
                allocationId:
                  type: string
                amount:
                  $ref: '#/components/schemas/searchPayableMoney'
                entityId:
                  type: string
                entityType:
                  type: string
                  enum:
                  - reversal
                  - settlement
              required:
              - allocationId
              - amount
              - entityId
              - entityType
              additionalProperties: false
          documentaryEvidenceCannotBeProvided:
            allOf:
            - $ref: '#/components/schemas/searchPayableDocEvidenceCannotBeProvided'
            description: Present when the member declared that documentary evidence cannot be provided.
          itemLines:
            type: array
            description: Accounting line items with VAT breakdown.
            items:
              $ref: '#/components/schemas/searchPayableItemLine'
          documentaryEvidence:
            description: Attached documentary evidence (invoice, declaration of missing invoice, mileage or per-diem entry).
            anyOf:
            - type: object
              properties:
                validity:
                  $ref: '#/components/schemas/searchPayableValidity'
                compliances:
                  $ref: '#/components/schemas/searchPayableCompliances'
                type:
                  type: string
                  enum:
                  - invoice
                invoiceNumber:
                  type: string
              required:
              - validity
              - type
              additionalProperties: false
            - type: object
              properties:
                validity:
                  $ref: '#/components/schemas/searchPayableValidity'
                compliances:
                  $ref: '#/components/schemas/searchPayableCompliances'
                type:
                  type: string
                  enum:
                  - declarationOfMissingInvoice
                invoiceNumber:
                  type: string
              required:
              - validity
              - type
              additionalProperties: false
            - type: object
              properties:
                validity:
                  $ref: '#/components/schemas/searchPayableValidity'
                compliances:
                  $ref: '#/components/schemas/searchPayableCompliances'
                type:
                  type: string
                  enum:
                  - mileageEntry
                invoiceNumber:
                  type: string
              required:
              - validity
              - type
              additionalProperties: false
            - type: object
              properties:
                validity:
                  $ref: '#/components/schemas/searchPayableValidity'
                compliances:
                  $ref: '#/components/schemas/searchPayableCompliances'
                type:
                  type: string
                  enum:
                  - perDiemEntry
                invoiceNumber:
                  type: string
              required:
              - validity
              - type
              additionalProperties: false
          functionalExchangeRate:
            allOf:
            - $ref: '#/components/schemas/searchPayableRate'
            description: Exchange rate from transaction currency to functional currency.
          spendingExchangeRate:
            allOf:
            - $ref: '#/components/schemas/searchPayableRate'
            description: Exchange rate from spending (card) currency to transaction currency.
          counterparty:
            description: The supplier or employee counterparty for this expense.
            anyOf:
            - type: object
              properties:
                type:
                  type: string
                  enum:
                  - supplier
                supplierId:
                  type: string
              required:
              - type
              - supplierId
              additionalProperties: false
            - type: object
              properties:
                type:
                  type: string
                  enum:
                  - employee
                memberId:
                  type: string
              required:
              - type
              - memberId
              additionalProperties: false
          commitmentCounterparty:
            description: The spending commitment counterparty, when available. For expense claims, a supplier reference identifies the merchant while counterparty identifies the employee being reimbursed. The merchant name is available from the payable detail response; never use the employee accountPayable as a merchant creditor account.
            anyOf:
            - type: object
              properties:
                type:
                  type: string
                  enum:
                  - supplier
                supplierId:
                  type: string
              required:
              - type
              - supplierId
              additionalProperties: false
            - type: object
              properties:
                type:
                  type: string
                  enum:
                  - employee
                memberId:
                  type: string
              required:
              - type
              - memberId
              additionalProperties: false
