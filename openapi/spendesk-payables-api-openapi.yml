openapi: 3.2.0
info:
  title: Spendesk Public Payables API
  description: Spendesk Public API
  version: '1.0'
  summary: Spendesk Public API
  contact:
    email: support-public-api@spendesk.com
    url: https://developer.spendesk.com/
    name: Spendesk for Developers
  termsOfService: https://www.spendesk.com/en/legals/terms/api-agreement
servers:
- url: https://public-api.spendesk.com
  description: Production
- url: https://public-api.demo.spendesk.com
  description: Sandbox
tags:
- name: Payables
  description: 'Payables — invoices, credit notes, card purchases and expense claims — with their attachments. Retrieve them in bulk through snapshots, search them, read one by ID; experimental endpoints let accounting integrations update accounting fields, mark payables ready and write their bookkeeping status back. Part of: Retrieving Spend Data, Building an accounting integration.'
paths:
  /v1/payables/bookkeeping-status:
    put:
      operationId: v1-put-payables-bookkeeping-status
      summary: Update Payables bookkeeping status
      tags:
      - Payables
      description: '**Allowed Scopes**: _`experimental:accounting:update`_


        Update the accounting status for multiple Payables.


        The user associated with the token must have the Controller role in the company. Otherwise, the request fails with a `403` and the `CONTROLLER_ROLE_REQUIRED` error code.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                payables:
                  description: Payables to update
                  type: array
                  items:
                    type: object
                    discriminator:
                      propertyName: status
                    oneOf:
                    - additionalProperties: false
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The ID of the Payable
                          examples:
                          - bc9cef35-401d-4ea4-b384-ed725e6685cf
                          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                        version:
                          type: number
                          description: The version of the Payable to update
                          examples:
                          - 1
                        status:
                          type: string
                          description: The new bookkeeping status to set for the Payable
                          examples:
                          - exportedManually
                          enum:
                          - exportedManually
                      required:
                      - id
                      - version
                      - status
                    - additionalProperties: false
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The ID of the Payable
                          examples:
                          - bc9cef35-401d-4ea4-b384-ed725e6685cf
                          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                        version:
                          type: number
                          description: The version of the Payable to update
                          examples:
                          - 1
                        status:
                          type: string
                          description: The new bookkeeping status to set for the Payable
                          examples:
                          - failedExport
                          enum:
                          - failedExport
                        message:
                          type: string
                          description: The reason for the failure
                          examples:
                          - Failed to export due to missing information
                      required:
                      - id
                      - version
                      - status
                  minItems: 1
                  maxItems: 50
                  example:
                    payables:
                    - id: bc9cef35-401d-4ea4-b384-ed725e6685cf
                      version: 1
                      status: exportedManually
                status:
                  type: string
                  description: The new bookkeeping status to set for the Payables
                  enum:
                  - exportedManually
                  deprecated: true
                  example: exportedManually
              required:
              - payables
      parameters:
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:accounting:update
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bulkUpdatePayablesBookkeepingStatusFullSuccess'
        '207':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bulkUpdatePayablesBookkeepingStatusPartialSuccess'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbiddenControllerRoleRequired'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooLarge'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unsupportedMediaType'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
  /v1/payables/search:
    post:
      operationId: v1-search-payables
      summary: Search Payables
      tags:
      - Payables
      description: '**Allowed Scopes**: _`experimental:payable-search:read`_


        Searches payables using filters with cursor-based pagination. With an organisation-level token, each search covers the company in `X-Company-Id` only, and results carry no company ID: send one search per company. Payables search data is cached for up to 24 hours. Changes made through the API are returned by subsequent reads; changes made in Spendesk can take up to 24 hours to appear.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/searchPayableBody'
      parameters:
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:payable-search:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  nextCursor:
                    type:
                    - 'null'
                    - string
                  referencesToRetry:
                    type: array
                    items:
                      type: string
                  payables:
                    type: array
                    items:
                      $ref: '#/components/schemas/searchPayable'
                required:
                - nextCursor
                - referencesToRetry
                - payables
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooLarge'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unsupportedMediaType'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
  /v1/payables/{id}:
    get:
      operationId: v1-get-payable-by-id
      summary: Get Payable by ID
      tags:
      - Payables
      description: '**Allowed Scopes**: _`payable:read`_


        Retrieves a single payable by its ID. Payable data is cached for up to 20 minutes. Changes made through the API are returned by subsequent reads; changes made in Spendesk can take up to 20 minutes to appear.


        For accounting export use cases, each line item''s net amount is available as `lineItems[].financial.netAmount`. Amounts are expressed in the smallest unit of the payable currency, for example cents for EUR and USD, pence for GBP, and yen for JPY.'
      parameters:
      - schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        example: bc9cef35-401d-4ea4-b384-ed725e6685cf
        in: path
        name: id
        required: true
        description: ID of the payable to retrieve.
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - payable:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: A payable is a short-term liability owed by a company to its creditors (suppliers or employees). Several types of payables are supported by Spendesk, e.g. Invoices, Credit Notes, Expense Claims, Physical card purchases, Single Use card purchases, Subscription card purchases, etc.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payable'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
    patch:
      operationId: v1-patch-payable-accounting-fields
      summary: Update Payable accounting fields
      tags:
      - Payables
      description: '**Allowed Scopes**: _`experimental:accounting:update`_


        Updates accounting fields for one Payable with optimistic locking.


        The user associated with the token must have the Controller role in the company. Otherwise, the request fails with a `403` and the `CONTROLLER_ROLE_REQUIRED` error code.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version:
                  type: number
                  description: The current version of the Payable to update.
                  example: 3
                description:
                  type: string
                  description: Description to apply to the Payable.
                  example: Team offsite lunch
                accountPayableId:
                  type: string
                  format: uuid
                  description: Account payable to apply to the Payable.
                  example: 00886d31-f27d-5366-8b05-cd287dc0f43d
                accountingDate:
                  type: string
                  format: date
                  description: Date in the `YYYY-MM-DD` format.
                lineItems:
                  type: array
                  minItems: 1
                  description: Complete replacement for the payable line items. To preserve a line returned by GET /v1/payables/{id}, map financial.grossAmount.amount to grossAmount, expenseAccount.id to expenseAccountId, vatAccount.id or reverseChargeAccount.id to taxAccountId, costCenterId directly, and analyticalProperties fieldId/valueId pairs to analyticalFieldValues; use null only when an account or cost center should remain unassigned. A null taxAccountId is not a tax-exempt, zero-rated, or reverse-charge treatment; changing tax treatment requires the matching company tax account ID. Gross amounts must sum to the payable amount. Tax amounts are recalculated from taxAccountId, clearing manual VAT adjustments.
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      grossAmount:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                        description: Gross amount of this line in the payable currency smallest unit (for example cents for EUR and USD, or yen for JPY).
                        example: 12000
                      expenseAccountId:
                        type: string
                        nullable: true
                        description: Expense account ID, or null to leave the line unassigned.
                        example: exp_acc_123
                      taxAccountId:
                        type: string
                        nullable: true
                        description: Tax or reverse-charge account ID. Use null only to leave the line without an assigned tax account. Null does not mean tax-exempt, zero-rated, or reverse charge; those treatments require the matching company tax account ID.
                        example: tax_acc_456
                      costCenterId:
                        type: string
                        nullable: true
                        description: Cost center ID, or null to clear it. All lines must use the same value when analytical splitting is disabled.
                        example: cc_789
                      analyticalFieldValues:
                        type: array
                        description: Complete analytical field value set; an empty array clears it. All lines must use the same set when analytical splitting is disabled.
                        items:
                          type: object
                          additionalProperties: false
                          properties:
                            fieldId:
                              type: string
                              description: ID of the analytical field.
                              example: field_001
                            valueId:
                              type: string
                              description: ID of the analytical field value.
                              example: val_abc
                          required:
                          - fieldId
                          - valueId
                    required:
                    - grossAmount
                    - expenseAccountId
                    - taxAccountId
                    - costCenterId
                    - analyticalFieldValues
                amortisation:
                  type: object
                  additionalProperties: false
                  description: Prepaid-expense amortisation period to apply to the Payable.
                  properties:
                    startDate:
                      type: string
                      format: date
                      description: Date in the `YYYY-MM-DD` format.
                    endDate:
                      type: string
                      format: date
                      description: Date in the `YYYY-MM-DD` format.
                  required:
                  - startDate
                  - endDate
              required:
              - version
              minProperties: 2
              errorMessage:
                minProperties: must include at least one of description, accountPayableId, accountingDate, lineItems or amortisation
      parameters:
      - schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        example: bc9cef35-401d-4ea4-b384-ed725e6685cf
        in: path
        name: id
        required: true
        description: The ID of the Payable
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:accounting:update
      x-roles:
      - controller
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  item:
                    type: object
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: The ID of the Payable
                        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                        example: bc9cef35-401d-4ea4-b384-ed725e6685cf
                      version:
                        type: number
                        description: The updated Payable version.
                      bookkeepingStatus:
                        type: string
                        description: The updated bookkeeping status of the Payable.
                    required:
                    - id
                    - version
                    - bookkeepingStatus
                required:
                - item
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbiddenControllerRoleRequired'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/conflict'
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooLarge'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unsupportedMediaType'
        '422':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  reason:
                    type: string
                    description: The payable state is incompatible with this update.
                    example: invalidState
                required:
                - reason
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
  /v1/payables/{id}/mark-as-ready:
    post:
      operationId: v1-post-payable-mark-as-ready
      summary: Mark Payable as ready
      tags:
      - Payables
      description: '**Allowed Scopes**: _`experimental:accounting:update`_


        Validates a Payable and marks it as ready for accounting export when all required bookkeeping information is present.


        The user associated with the token must have the Controller role in the company. Otherwise, the request fails with a `403` and the `CONTROLLER_ROLE_REQUIRED` error code.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                version:
                  type: number
                  description: The current version of the Payable to mark as ready.
                  example: 1
              required:
              - version
      parameters:
      - schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        example: bc9cef35-401d-4ea4-b384-ed725e6685cf
        in: path
        name: id
        required: true
        description: The ID of the Payable
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:accounting:update
      x-roles:
      - controller
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  id:
                    type: string
                    format: uuid
                    description: The ID of the Payable
                    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    example: bc9cef35-401d-4ea4-b384-ed725e6685cf
                  status:
                    type: string
                    description: The updated bookkeeping status of the Payable.
                    enum:
                    - prepared
                required:
                - id
                - status
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbiddenControllerRoleRequired'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/conflict'
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooLarge'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unsupportedMediaType'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
  /v1/payables/{payableId}/attachments:
    get:
      operationId: v1-get-payable-attachments
      summary: Get Payable Attachments
      tags:
      - Payables
      description: '**Allowed Scopes**: _`payable-attachment:read`_


        Returns attachments for a given payable as short lived URLs. Download and save downloaded files in your long term storage. Payable attachment data is cached for up to 55 minutes. Changes made through the API are returned by subsequent reads; changes made in Spendesk can take up to 55 minutes to appear.'
      parameters:
      - schema:
          type: string
          format: uuid
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        example: bc9cef35-401d-4ea4-b384-ed725e6685cf
        in: path
        name: payableId
        required: true
        description: The ID of the Payable
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - payable-attachment:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        mimeType:
                          type: string
                          description: Media type of the attachment.
                        checksum:
                          type: string
                          description: A file checksum is like a unique digital fingerprint that helps ensure a file hasn’t been tampered with during transfer or storage, providing data integrity and security assurance.
                        attachedAt:
                          type: string
                          format: date
                          description: The date the attachment was added.
                        url:
                          type: string
                          description: A short-lived URL to download the attachment.
                      required:
                      - mimeType
                      - url
                required:
                - data
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
