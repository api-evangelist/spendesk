    searchPayablePaymentStatusFilter:
      description: 'Filter payables by payment status. `toPay` means any outstanding balance remains — it INCLUDES partially-paid invoices and does NOT mean ''fully unpaid''. `paid` means the allocations on the payable sum to its full amount, leaving zero outstanding (settlements and/or credit notes, so a credit note alone can make an invoice `paid`); it EXCLUDES partially-paid invoices, which are classified as `toPay`. Payment status is not returned on the payable, and the amount fields are always the full invoice value, never reduced by partial payments. So: to size true outstanding AP, sum `outstandingFunctionalAmount` (the authoritative server-computed remainder, in the company''s functional currency; `outstandingAmount` is the same figure in each payable''s own currency and is therefore NOT summable across currencies) rather than summing `amount` over `toPay` payables, and fall back to `amount` minus `allocations[]` only on payables where those fields are absent. To size total cash paid out, use get_settlements rather than summing `amount` over `paid` payables (which omits the partial payments already made on still-open `toPay` invoices) — do NOT aggregate `allocations[]` for cash: only `entityType: ''settlement''` entries are money moved, while `reversal` (on an expense) and `expense` (on a credit note) entries are credit notes or card refunds applied document-to-document, so an invoice fully covered by a credit note reports `paid` with `outstandingAmount` 0 and zero cash paid; allocation amounts also carry the sign of the payable they sit on, so allocations on credit-note payables are negative.'
      allOf:
      - type: object
        properties:
          field:
            type: string
            enum:
            - paymentStatus
        required:
        - field
      - type: object
        properties:
          operator:
            type: string
            enum:
            - '='
            - '!='
          value:
            anyOf:
            - type: 'null'
            - type: array
              items:
                type: string
                enum:
                - toPay
                - paid
              minItems: 1
            - type: string
              enum:
              - any
        required:
        - operator
        - value
      title: searchPayablePaymentStatusFilter
    searchPayableBody:
      type: object
      description: Search body for querying payables. Combine leaf filters or compound (and/or) filter groups with cursor-based pagination.
      properties:
        filters:
