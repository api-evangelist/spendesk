    searchPayableAmountFieldFilter:
      description: 'Filter payables by an amount field. `grossAmount` is the payable''s total. `netAmount` and `vatAmount` are not totals: each item line is tested on its own and a payable matches when ANY one line meets the condition (so `netAmount > 5000` misses a payable with two 3,000 lines, and payables with no item lines never match); for a threshold on a payable''s net or VAT total, sum itemLines[].netAmount / vatAmount client-side (they are in the payable''s own currency, not the functional currency). `value` is a DECIMAL amount in MAJOR units of the company''s functional currency (the currency of functionalAmount), NOT the minor-unit coefficient returned in money objects and NOT the payable''s own currency: for payables over EUR 5,000.00 use `{ "field": "grossAmount", "operator": ">", "value": 5000 }`, not 500000.'
      allOf:
      - type: object
        properties:
          field:
            type: string
            enum:
            - grossAmount
            - netAmount
            - vatAmount
        required:
        - field
      - $ref: '#/components/schemas/searchPayableAmountOperand'
      title: searchPayableAmountFieldFilter
