          description: A single value filter or a compound filter group. Omit to return all payables.
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          description: Maximum number of payables to return per page, from 1 to 1000. Defaults to 1000.
        cursor:
          type: string
          description: Opaque pagination cursor returned in the previous response’s nextCursor field. Omit for the first page.
        sort:
          type: string
          enum:
          - asc
          - desc
          description: Sort order by creation date. Defaults to ascending.
      additionalProperties: false
      title: searchPayableBody
      example:
