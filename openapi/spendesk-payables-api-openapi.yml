        - amount
        - currency
        - functionalAmount
        - functionalCurrency
        - creationDate
        - memberId
        - version
        - kind
        - subType
        - description
        - firstCreatedAt
        - type
        - allocations
        - itemLines
        - functionalExchangeRate
        - counterparty
        additionalProperties: false
      title: searchPayable
      example:
        id: bc9cef35-401d-4ea4-b384-ed725e6685cf
        state: toExport
        amount: 1500
