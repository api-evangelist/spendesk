openapi: 3.2.0
info:
  title: Spendesk Public Expense categories API
  description: Spendesk Public API
  version: '1.0'
  summary: Spendesk Public API
  contact:
    email: support-public-api@spendesk.com
    url: https://developer.spendesk.com/
    name: Spendesk for Developers
  termsOfService: https://www.spendesk.com/en/legals/terms/api-agreement
servers:
- url: https://public-api.spendesk.com
  description: Production
- url: https://public-api.demo.spendesk.com
  description: Sandbox
tags:
- name: Expense categories
  description: 'Expense categories. `v1` reads them; the experimental `v2` endpoints manage expense category fields and their categories. Part of: Building an accounting integration.'
paths:
  /v1/expense-categories:
    get:
      operationId: v1-get-expense-categories
      summary: Get Expense Categories
      tags:
      - Expense categories
      description: '**Allowed Scopes**: _`expense-category:read`_


        Returns expense categories of the Spendesk entity (company). Expense category and cost center data are cached for up to 24 hours. Changes, including those made through the API, can take up to 24 hours to appear.'
      parameters:
      - schema:
          type: array
          items:
            type: string
        in: query
        name: ids
        required: false
        description: Expense category IDs to filter by.
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - expense-category:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      additionalProperties: false
                      type: object
                      properties:
                        id:
                          type: string
                          description: Expense category ID
                        name:
                          type: string
                          description: Name of expense category
                        costCenters:
                          type: array
                          description: Array of cost centers
                          items:
                            additionalProperties: false
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                                description: Cost center ID
                              name:
                                type: string
                                description: Name of cost center
                            required:
                            - id
                            - name
                      required:
                      - id
                      - name
                      - costCenters
                required:
                - data
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
  /v2/expense-category-fields:
    get:
      operationId: v2-list-expense-category-fields
      summary: List Expense Category Fields
      tags:
      - Expense categories
      description: '**Allowed Scopes**: _`experimental:expense-category-v2:read`_


        Returns the expense category field for the company. The array is empty if the company has no expense category field configured. Expense category field data is cached for up to 24 hours. Changes made through the API are returned by subsequent reads; changes made in Spendesk can take up to 24 hours to appear.'
      parameters:
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:expense-category-v2:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    type: array
                    description: Expense category fields list.
                    items:
                      $ref: '#/components/schemas/expenseCategoryFieldV2'
                required:
                - data
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
    post:
      operationId: v2-create-expense-category-field
      summary: Create Expense Category Field
      tags:
      - Expense categories
      description: '**Allowed Scopes**: _`experimental:expense-category-v2:write`_


        Creates the company''s expense category field. A company can only have one expense category field; creating a second one returns a 409.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                isRequired:
                  type: boolean
                  default: true
                  description: Whether the field is mandatory. Defaults to true.
                isSplittable:
                  type: boolean
                  default: false
                  description: Whether the field is splittable. Defaults to false.
      parameters:
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:expense-category-v2:write
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/expenseCategoryFieldV2'
                required:
                - data
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
