    patch:
      operationId: v2-update-expense-category
      summary: Update Expense Category
      tags:
      - Expense categories
      description: '**Allowed Scopes**: _`experimental:expense-category-v2:write`_


        Partially updates an existing expense category for the expense category field. Returns 404 if the field, the category or a cost center in costCenters does not exist. Returns 409 if a category with the same name already exists for the field.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
