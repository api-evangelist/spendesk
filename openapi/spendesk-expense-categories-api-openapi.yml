      summary: Get Expense Category
      tags:
      - Expense categories
      description: '**Allowed Scopes**: _`experimental:expense-category-v2:read`_


        Returns a single expense category by ID for the expense category field. Returns 404 if the field or the category does not exist. Expense category data is cached for up to 24 hours. Changes made through the API are returned by subsequent reads; changes made in Spendesk can take up to 24 hours to appear.'
