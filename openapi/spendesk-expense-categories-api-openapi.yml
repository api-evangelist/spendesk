  /v2/expense-category-fields/{fieldId}/categories:
    get:
      operationId: v2-list-expense-categories
      summary: List Expense Categories
      tags:
      - Expense categories
      description: '**Allowed Scopes**: _`experimental:expense-category-v2:read`_


        Returns expense categories for the expense category field, using forward-only cursor pagination. Returns 404 if the field does not exist. Expense categories are cached for up to 24 hours. Changes made through the API are returned by subsequent reads; changes made in Spendesk can take up to 24 hours to appear. Archived categories are included by default.'
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 30
        in: query
        name: limit
        required: false
        description: Maximum number of categories to return.
      - schema:
          type: string
        in: query
        name: cursor
        required: false
        description: Opaque pagination cursor returned as `meta.pagination.nextCursor` by a previous call. Omit to fetch the first page.
      - schema:
          type: string
        example: x__8patkcjpdq7
        in: path
        name: fieldId
        required: true
        description: Expense category field ID.
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:expense-category-v2:read
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '200':
          description: Expense categories list.
          content:
            application/json:
              schema:
                description: Expense categories list.
                type: object
                additionalProperties: false
                properties:
                  meta:
                    $ref: '#/components/schemas/expenseCategoryV2Meta'
                  data:
                    description: A page of expense categories.
                    type: array
                    items:
                      $ref: '#/components/schemas/expenseCategoryV2'
                required:
                - data
                - meta
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notFound'
        '429':
          description: Too Many Requests
          headers:
            retry-after:
              schema:
                type: integer
              description: Seconds to wait before retrying the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tooManyRequests'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internalServerError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serviceUnavailableError'
    post:
      operationId: v2-create-expense-category
      summary: Create Expense Category
      tags:
      - Expense categories
      description: '**Allowed Scopes**: _`experimental:expense-category-v2:write`_


        Creates a new expense category for the expense category field. Returns 404 if the field or a cost center in costCenters does not exist. Returns 409 if a category with the same name already exists for the field.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  description: Expense category name.
                costCenters:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                    required:
                    - id
                  description: Cost centers to associate with the expense category.
              required:
              - name
      parameters:
      - schema:
          type: string
        example: x__8patkcjpdq7
        in: path
        name: fieldId
        required: true
        description: Expense category field ID.
      - schema:
          type: string
        in: header
        name: X-Company-Id
        required: false
        description: ID of the company the request acts on. Required with an organisation-level token; not needed with a company-level token.
      security:
      - Authentication:
        - experimental:expense-category-v2:write
      x-roles:
      - controller
      - admin
      - accountOwner
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/expenseCategoryV2'
                required:
                - data
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/badRequest'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unauthorized'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/forbidden'
        '404':
